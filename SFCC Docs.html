oyalty points stored in an external system.", "a": "Create a **Shopper Custom API** `loyalty` in a cartridge: `schema.yaml` with `GET /customers/{customerId}/points`, `api.json` mapping to `loyalty.js`, which checks the SLAS token's customer matches, calls the loyalty service via LocalServiceRegistry (timeout, circuit breaker) and returns `{ points }`. Cache briefly where possible. Call it with `siteId`."}], "notes": ["Public vs private SLAS client is decided by one question: can the app keep a secret safe?", "Use Admin APIs only from back-end systems; never ship admin credentials to a browser.", "Rate limits and timeouts apply: cache on your side and batch calls."], "id": "apis", "title": "Headless: OCAPI, SCAPI and SLAS", "icon": "braces", "time": {"easy": 8, "crash": 4, "standard": 20}, "summary": "The two API families, shopper login (SLAS), hooks and custom APIs, and when to use what.", "easy": "Besides SFRA web pages, SFCC can be used **headless**: another front end (a React site, a mobile app) talks to SFCC only through **APIs**.\n\nTwo API families:\n- **OCAPI** (Open Commerce API), the older one: **Shop API** for shopper actions, **Data API** for admin work, **Meta API** for descriptions.\n- **SCAPI** (B2C Commerce API), the newer one and the default for new work: **Shopper APIs** (browse, cart, checkout) and **Admin APIs** (manage products, orders…), plus **Custom APIs** you write yourself.\n\nShoppers log in to SCAPI through **SLAS** (Shopper Login and API Access Service), which hands out tokens using OAuth.\n\nThe **Composable Storefront** (PWA Kit) is Salesforce's React storefront built on the Shopper APIs.", "crash": "- OCAPI: Shop / Data / Meta APIs; configured with **OCAPI settings JSON** in Business Manager (per client ID: allowed resources and methods). Client IDs from Account Manager. Not the default for new projects.\n- SCAPI: **Shopper APIs** (customer-facing, auth via **SLAS**) and **Admin APIs** (merchant/back-office, auth via **Account Manager** client credentials). Short code + organization ID in the URL. Rate limited; shopper calls have a response timeout (10 s).\n- **SLAS clients:** **public** (no secret, can't keep secrets: SPA, mobile) use `authorization_code_pkce`; **private** (BFF/server) use `client_credentials` for guests and PKCE for registered logins. `channel_id` (site) is required for guest tokens.\n- Tokens: short-lived access token (JWT) + refresh token.\n- Extend: **hooks** (`dw.ocapi.shop.*` names, used by both families) and **Custom APIs** (OAS 3 contract + script + `api.json` in a cartridge, Shopper or Admin type).\n- Shopper custom API endpoints need `siteId`; Admin ones must not have it and the cartridge must be on the Business Manager site path.\n- Hybrid storefronts (part SFRA, part composable) share sessions via **hybrid auth** / session bridge.\n- You can't use one API client ID for both OCAPI and SCAPI.", "standard": "## Families\n| | OCAPI | SCAPI |\n|---|---|---|\n| Since | 2014 | 2020 |\n| Groups | Shop, Data, Meta | Shopper, Admin, Custom |\n| Shopper auth | OCAPI JWT / session | SLAS (OAuth 2.1, refresh tokens) |\n| Admin auth | Account Manager client | Account Manager client |\n| Config | OCAPI settings JSON in BM | API client roles, SLAS client config |\n| Extend | Hooks | Hooks + Custom APIs |\n\nNew projects should default to SCAPI. OCAPI is still used for some Data API tasks and existing integrations.\n\n## SLAS in practice\n- **Public client** (browser SPA, mobile app): no secret; guest and registered logins use `authorization_code_pkce` (code verifier and challenge).\n- **Private client** (server or backend-for-frontend): has a secret; guest tokens with `client_credentials` (plus `channel_id`), registered logins with PKCE; trusted system flows for acting on behalf of a shopper.\n- Refresh tokens keep sessions alive; rotate guest sessions after an order.\n\n## Calling a Shopper API (conceptually)\n```\nPOST https://{shortCode}.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/{orgId}/oauth2/token\n  grant_type=client_credentials&channel_id=RefArch   (private client, Basic auth with id:secret)\n\nGET  https://{shortCode}.api.commercecloud.salesforce.com/product/shopper-products/v1/organizations/{orgId}/products/{id}?siteId=RefArch\n  Authorization: Bearer <access_token>\n```\n\n## Hooks for APIs\n`before…` / `after…` / `modify…Response` hooks with `dw.ocapi.shop.*` names run for both families: validate input, change data, or add `c_` fields to responses.\n\n## Custom APIs\nA cartridge contains `rest-apis/<api-name>/` with `schema.yaml` (OpenAPI 3 contract), `api.json` (maps endpoints to script functions) and the script. Deployed with the code version; endpoints appear under `/custom/<api-name>/v1/…`. Shopper custom APIs use SLAS tokens and require `siteId`; Admin custom APIs use Account Manager tokens."}, {"sources": [["Salesforce developers: Caching strategies", "https://developer.salesforce.com/docs/commerce/sfra/guide/caching-strategies-sk.html"], ["Salesforce developers: Custom caches", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-custom-caches.html"], ["Salesforce developers: Governance and quotas", "https://developer.salesforce.com/docs/commerce/commerce-api/guide/b2c-governance-and-quotas.html"], ["Trailhead: Implement caching in the web server layer", "https://trailhead.salesforce.com/content/learn/modules/b2c-implement-cache/b2c-implement-cache-web-server"]], "q": [{"id": "performance-q1", "lv": "basic", "top": true, "q": "What caching layers exist in SFCC?", "a": "Browser, CDN, the web server page cache (and static cache), app-server custom caches, and finally storage (precomputed data)."}, {"id": "performance-q2", "lv": "basic", "top": true, "q": "How do you cache a page but still show the shopper's name?", "a": "Cache the page and render the name in a remote include (separate uncached controller) or load it with AJAX."}, {"id": "performance-q3", "lv": "mid", "top": true, "q": "What's a custom cache and its limits?", "a": "An app-server key-value cache defined in caches.json and used via CacheMgr. About 20 MB per app server, not synchronised between servers, and cleared on code activation and replication. Always provide a loader for misses."}, {"id": "performance-q4", "lv": "mid", "top": true, "q": "What are quotas and what happens when one is exceeded?", "a": "Platform limits on API usage and object counts. Exceeding an enforced quota throws an exception and stops the operation; otherwise it's logged. Monitor them in Quota Status and quota logs."}, {"id": "performance-q5", "lv": "mid", "top": false, "q": "Why use promotion-sensitive caching?", "a": "Prices with promotions differ by shopper context. The promotion-sensitive cache varies the cached response by active promotions so shoppers don't see each other's prices."}, {"id": "performance-q6", "lv": "adv", "top": false, "q": "The category page is slow (3 s). How do you investigate and fix it?", "a": "Check the Pipeline Profiler and logs for the controller, confirm page caching applies, look for per-product loops (getProduct, availability, promotions), synchronous service calls and quota warnings. Use the search hits' data, cache tiles, move personal parts to remote includes, and precompute expensive values in jobs."}], "p": [{"lv": "easy", "t": "Which layer?", "q": "You want to store a JSON config read from a file on every request. Which cache?", "a": "A **custom cache** (caches.json + CacheMgr) keyed by site and locale, with a loader function."}, {"lv": "std", "t": "Speed up a store-hours widget", "q": "Each page calls a store service to show today's opening hours in the header.", "a": "Move the widget into a remote include `Stores-Hours` with a cache period of an hour (hours change rarely), cache the service response in a custom cache with `expireAfterSeconds: 3600`, set a short service timeout and hide the widget on failure. The main pages stay fully cacheable."}], "notes": ["Cache the page, personalise the fragment.", "Custom caches are per app server and get cleared on deploys: always load on a miss.", "Watch Quota Status after every release."], "id": "performance", "title": "Caching, performance and quotas", "icon": "bolt", "time": {"easy": 8, "crash": 5, "standard": 22}, "summary": "Cache layers, page cache and remote includes, custom caches, quotas and common performance mistakes.", "easy": "A fast shop avoids doing the same work again. **Caching** means keeping a ready copy.\n\nSFCC has several layers, from closest to the shopper to furthest:\n1. **Browser** keeps images and files.\n2. **CDN** (the network in front of the shop) keeps static files and pages.\n3. **Page cache** on the web server keeps whole HTML pages or parts of pages.\n4. **Custom caches** in the app server keep data your code computed.\n5. The **database**: slowest.\n\nThe trick: cache most of a page, and fetch only the personal bits (cart count, login name) separately with a **remote include**.\n\n**Quotas** are SFCC's safety limits on code, for example how many objects you create in one request. Breaking an enforced quota stops the request with an error.", "crash": "- Layers: browser → CDN (eCDN) → web server **page cache** + static cache → app server **custom caches** (`CacheMgr`) → database.\n- Page cache key = full URL (plus personalisation for price books and promotions). Turn it on per site; set with `<iscache>` or `res.cachePeriod` / SFRA `cache.applyDefaultCache` (24h) and `cache.applyPromotionSensitiveCache`.\n- Several iscache settings → **shortest wins**. Remote includes have their own policy and aren't invalidated with the parent.\n- Never cache personal data. Use remote includes or client-side calls for personal parts.\n- Ignore meaningless URL parameters for the cache key (Business Manager feature switch) to raise hit rate.\n- Custom caches: defined in `caches.json` (referenced from package.json), `CacheMgr.getCache(id).get(key, loaderFn)`; ~20 MB per app server; not shared across app servers; cleared on code activation and replication. Optional `expireAfterSeconds`.\n- Quotas: Business Manager › Administration › Operations › **Quota Status** and quota logs; enforced quotas throw exceptions; warn thresholds at about 60%.\n- Classic slow spots: `queryAllSiteProducts` in storefront, `ProductMgr.getProduct` in loops, huge `isloop`s, synchronous services on hot pages, uncached category pages, big transactions, string concatenation of huge payloads.\n- Tools: Business Manager **Pipeline Profiler** (controller timings), **Code Profiler**, Reports & Dashboards (Technical), log center.", "standard": "## Cache layers\n| Layer | What it caches | You control it with |\n|---|---|---|\n| Browser | Static assets | Cache headers, versioned file names |\n| CDN | Static files, some responses | eCDN settings |\n| Web server page cache | HTML responses and remote include fragments | `<iscache>`, `res.cachePeriod`, cache middleware, partitions/invalidation |\n| App server custom cache | Computed data | `caches.json` + `CacheMgr` |\n| Storage | Precomputed values | Custom attributes / custom objects updated by jobs |\n\nThe goal: serve as much as possible from the layer nearest the shopper.\n\n## Page caching in SFRA\n```js\nvar cache = require('*/cartridge/scripts/middleware/cache');\nserver.get('Show', cache.applyDefaultCache, function (req, res, next) { … });          // ~24h\nserver.get('Tile', cache.applyPromotionSensitiveCache, function (req, res, next) { … }); // varies by promotions\n```\nPersonalised parts move to their own routes and are included with `<isinclude url=\"${URLUtils.url('Account-Header')}\"/>`. Each remote include costs a request but keeps the big page cacheable.\n\nInvalidate page cache in Business Manager (Sites › Manage Sites › Cache), fully or by partition; it's spread over about 15 minutes in production.\n\n## Custom caches\n```json\n// caches.json\n{ \"caches\": [ { \"id\": \"StoreConfig\", \"expireAfterSeconds\": 3600 } ] }\n```\n```js\nvar cache = require('dw/system/CacheMgr').getCache('StoreConfig');\nvar cfg = cache.get(siteId + '_' + locale, function () { return loadConfig(siteId, locale); });\n```\n- About 20 MB for all custom caches per app server.\n- Each app server has its own copy; don't use it for data that must be consistent instantly.\n- Cleared on code activation and replication.\n- Include site and locale in keys.\n\n## Quotas\nLimits on API usage and object counts (for example sub-categories per category, objects created per page, string lengths). Check Quota Status and quota logs. Enforced quotas throw and stop the operation; warnings show in logs. Fix code before warnings become errors.\n\n## Common fixes\n- Use the search index (`ProductSearchModel`) for listings instead of loading products one by one.\n- Read what you need once and pass it down; avoid repeated `getProduct` or `getCategory` in loops.\n- Move partner calls off cached pages; use jobs for heavy work.\n- Commit job work in chunks.\n- Profile with the Pipeline Profiler before and after changes."}, {"sources": [["Script API: CSRFProtection", "https://documentation.b2c.commercecloud.salesforce.com/DOC1/topic/com.demandware.dochelp/DWAPI/scriptapi/html/api/class_dw_web_CSRFProtection.html"], ["Salesforce developers: Secure your B2C Commerce solution", "https://developer.salesforce.com/docs/platform/isvforce/guide/secure-code-b2c-commerce.html"], ["Salesforce developers: Security (headless)", "https://developer.salesforce.com/docs/commerce/commerce-solutions/guide/security.html"]], "q": [{"id": "security-q1", "lv": "basic", "top": true, "q": "How does SFRA protect against CSRF?", "a": "The page that renders a form uses `csrfProtection.generateToken` to add a session-bound token to the form; the handling route uses `csrfProtection.validateRequest` (or `validateAjaxRequest`) and rejects requests without a valid token."}, {"id": "security-q2", "lv": "basic", "top": true, "q": "How do you prevent XSS in templates?", "a": "Keep ISML's default HTML encoding on `${}` and `<isprint>`, use SecureEncoder for non-HTML contexts, and validate input server-side."}, {"id": "security-q3", "lv": "mid", "top": true, "q": "Where should API keys live?", "a": "In service credentials (or encrypted password-type preferences) configured per instance in Business Manager, never in code, cartridges, logs or Git."}, {"id": "security-q4", "lv": "mid", "top": false, "q": "How do you safely query custom objects with user input?", "a": "Use placeholders: `queryCustomObjects(type, 'custom.email = {0}', sort, email)`; never concatenate input into the query string."}, {"id": "security-q5", "lv": "adv", "top": false, "q": "An order details URL takes orderID in the query. What must the controller check?", "a": "That the order exists and belongs to the logged-in customer (or the order token matches for guests); otherwise return 404 so other customers' orders can't be viewed by changing the ID."}], "p": [{"lv": "easy", "t": "Spot the bug", "q": "`<isprint value=\"${pdict.q}\" encoding=\"off\"/>` on the search page. What's wrong?", "a": "`q` comes from the URL, so with encoding off an attacker can inject script (reflected XSS). Remove `encoding=\"off\"`."}, {"lv": "std", "t": "Protect a new form", "q": "Add a \"change newsletter preference\" form with CSRF protection.", "a": "GET route with `csrfProtection.generateToken`, template with the hidden token input, POST route with `csrfProtection.validateAjaxRequest` (AJAX) plus `userLoggedIn.validateLoggedInAjax`, then update the profile inside `Transaction.wrap` and return JSON."}], "notes": ["Every state-changing POST needs CSRF validation.", "Default encoding on; turning it off needs a written reason.", "Ownership checks on every account and order route."], "id": "security", "title": "Security", "icon": "lock", "time": {"easy": 6, "crash": 4, "standard": 15}, "summary": "CSRF, XSS, injection, secrets, personal data and safe deployment.", "easy": "Three classic attacks and the SFCC answer:\n- **XSS** (someone injects a script into your page): print with ISML's default encoding (`${}`, `<isprint>`), never turn it off for shopper input.\n- **CSRF** (a bad site makes the shopper's browser submit your form): every form that changes something carries a secret **CSRF token**, and the server checks it.\n- **Leaking secrets**: passwords and API keys go into **service credentials** in Business Manager, never into code or logs.\n\nAlso: never store card numbers (use payment tokens), never log personal data, and check on the server that a shopper may only see their own orders and addresses.", "crash": "- **CSRF** in SFRA: `csrfProtection.generateToken` on the GET that renders the form; `csrfProtection.validateRequest` (form POST) or `validateAjaxRequest` (AJAX) on the handler. Template: `<input type=\"hidden\" name=\"${pdict.csrf.tokenName}\" value=\"${pdict.csrf.token}\"/>`. Tokens are tied to the session.\n- **XSS:** keep default encoding; `encoding=\"off\"` only for trusted HTML; `SecureEncoder.forJavaScript/forHtmlInDoubleQuoteAttribute…` for other contexts; validate input in form definitions (mandatory, regexp, max-length).\n- **Authorization:** check ownership (`order.customerNo === customer.profile.customerNo`), use `userLoggedIn.validateLoggedIn` middleware; never trust IDs from the browser.\n- **Query injection:** use placeholders in queries (`'custom.email = {0}'`), never string concatenation.\n- **Secrets:** service credentials or encrypted site preferences (password type); not in code, cartridges or Git.\n- **PCI:** don't store or log PAN/CVV; use the payment provider's tokens or hosted fields.\n- **Logs:** mask personal data (`filterLogMessage`), no tokens or passwords.\n- **Headers:** security headers (CSP, X-Frame-Options, HSTS) via the platform's HTTP headers configuration (`httpHeadersConf.json` in SFRA cartridges).\n- **Access:** Business Manager roles with least privilege; two-factor login; client certificate needed for code upload to staging.", "standard": "## CSRF\n```js\nvar csrfProtection = require('*/cartridge/scripts/middleware/csrf');\n\nserver.get('EditProfile', csrfProtection.generateToken, function (req, res, next) {\n    res.render('account/editProfile', { profileForm: form });   // pdict.csrf.* added automatically\n    next();\n});\n\nserver.post('SaveProfile', csrfProtection.validateRequest, function (req, res, next) {\n    // reached only with a valid token\n    next();\n});\n```\nTemplate:\n```isml\n<input type=\"hidden\" name=\"${pdict.csrf.tokenName}\" value=\"${pdict.csrf.token}\"/>\n```\nUse `validateAjaxRequest` for AJAX posts (returns a JSON error instead of a page). Underneath is `dw.web.CSRFProtection` (`generateToken`, `getTokenName`, `validateRequest`).\n\n## XSS\n- `${value}` and `<isprint value=\"${value}\"/>` encode HTML. Don't use `encoding=\"off\"` for anything a user can influence.\n- Values placed inside JavaScript: `dw.util.SecureEncoder.forJavaScript(value)`, or pass data via `data-` attributes / JSON with encoding.\n- Server-side validation via form XML (`mandatory`, `regexp`, `max-length`, `range`), not just browser checks.\n\n## Authorization\nEvery controller that shows or changes private data must check the logged-in customer owns it:\n```js\nvar order = OrderMgr.getOrder(req.querystring.orderID, req.querystring.orderToken);\nif (!order || order.customerNo !== req.currentCustomer.profile.customerNo) { res.setStatusCode(404); … }\n```\n\n## Injection\n```js\nCustomObjectMgr.queryCustomObjects('Signup', 'custom.email = {0}', null, email);   // safe placeholder\n```\n\n## Secrets and data\n- API keys and passwords: service credentials (per instance), or password-type preferences.\n- Never commit secrets, `dw.json` with passwords, or certificates to Git.\n- Cards: hosted payment fields or tokens; nothing card-related in logs, custom attributes or custom objects.\n- Respect consent (SFRA `consentTracking`) and data retention."}, {"sources": [["Trailhead: Page Designer controllers, JSON and scripts", "https://trailhead.salesforce.com/content/learn/modules/salesforce-b2c-commerce-page-designer-for-sfra-developers/discover-page-and-component-type-controllers-json-and-scripts"], ["Trailhead: Explore Page Designer JSON and JS", "https://trailhead.salesforce.com/content/learn/modules/b2c-page-designer-developers/b2c-page-designer-explore-json-js"]], "q": [{"id": "content-q1", "lv": "basic", "top": true, "q": "What's the difference between a content asset, a content slot and a Page Designer page?", "a": "A content asset is a stored piece of content in a library. A slot is a fixed location in a template that merchants fill with content, products or categories by configuration. A Page Designer page is a merchant-assembled page built from components placed in regions."}, {"id": "content-q2", "lv": "basic", "top": true, "q": "Which files make up a Page Designer component type?", "a": "A JSON meta definition (attributes and regions) and a JavaScript file with a render function, same name, same folder under `experience/components`, usually plus an ISML template."}, {"id": "content-q3", "lv": "mid", "top": true, "q": "What does the render function return and receive?", "a": "It returns the markup as a string. It receives a context: for pages `context.page`, for components `context.content` (merchant-set values), `context.component` and render settings."}, {"id": "content-q4", "lv": "mid", "top": false, "q": "How do you limit what can be placed in a region?", "a": "In the region definition: `max_components`, and `component_type_inclusions` or `component_type_exclusions`."}, {"id": "content-q5", "lv": "mid", "top": false, "q": "How is a Page Designer page shown on the storefront?", "a": "Through a controller calling `PageMgr.renderPage(pageId, …)` (SFRA: `Page-Show?cid=pageId`), or assigned to a category and rendered via `PageMgr.getPageByCategory`."}, {"id": "content-q6", "lv": "adv", "top": false, "q": "Why is region output printed with encoding off and is that safe?", "a": "The region render returns HTML built by component templates, so it must not be escaped again. It's safe as long as the component templates themselves encode merchant values properly; never extend that pattern to request data."}], "p": [{"lv": "easy", "t": "Where does it go?", "q": "Marketing wants a banner on the home page that changes every two weeks. Slot or new code?", "a": "A **content slot** already in the home template (or a Page Designer component). Merchants schedule slot configurations in campaigns; no new code per change."}, {"lv": "std", "t": "Create a \"USP bar\" component", "q": "Three short texts with icons, editable by merchants.", "a": "`experience/components/assets/uspBar.json` with attributes `text1..3` (string) and `icon1..3` (enum of icon names), `region_definitions: []`; `uspBar.js` builds a HashMap with the values and renders `experience/components/assets/uspBar.isml`, which prints the texts with default encoding."}], "notes": ["Markup from regions is trusted platform output, which is why it's printed with encoding off; never do that for request data.", "Keep component scripts light; they run for every render (cache the page).", "Component type ID includes the subfolder path with dots."], "id": "content", "title": "Content, slots and Page Designer", "icon": "template", "time": {"easy": 7, "crash": 4, "standard": 18}, "summary": "Content assets and libraries, content slots, and building Page Designer page and component types.", "easy": "Shops need more than products: banners, FAQ pages, size guides.\n\n- **Content assets** are pieces of content (text, HTML, images) stored in a **library**.\n- **Content slots** are fixed places in a template (like \"home page hero\") that merchants fill with content, products or categories, on a schedule and for chosen customers.\n- **Page Designer** lets merchants build whole pages by dragging **components** (banner, carousel, text block) into **regions**. Developers create the types of pages and components; merchants assemble them.\n\nFor each Page Designer type a developer writes two files with the same name: a **JSON** file describing it (fields and regions) and a **JavaScript** file that renders it, usually with an ISML template.", "crash": "- Content assets live in **libraries** (site-private or shared); folders organise them; render with `ContentMgr.getContent(id)` and `asset.custom.body`.\n- Slots: `<isslot id=\"…\" context=\"global|category|folder\" context-object=\"${…}\" description=\"…\"/>`; slot configurations set content type, template, schedule, customer groups, and can belong to campaigns.\n- Page Designer types live in `cartridge/experience/pages` and `cartridge/experience/components` (subfolders allowed; component type ID becomes `folder.name`).\n- Each type = **meta definition JSON** + **script .js** with the same name in the same folder; names only letters, digits, underscore.\n- JSON: `name`, `description`, `attribute_definition_groups` (attributes: string, text, markup, image, file, boolean, enum, product, category, page, custom, url…), `region_definitions` (id, name, `max_components`, component type inclusions/exclusions). Components include `region_definitions: []` if none.\n- Script exports `render(context)` returning a **string**; usually `new Template('experience/components/x').render(model).text`.\n- Page context: `context.page`; component context: `context.content` (merchant values), `context.component`, `context.componentRenderSettings`.\n- Render regions with `PageRenderHelper.renderRegion(page.getRegion('main'))` printed with `encoding=\"off\"` (trusted markup).\n- Show a page from a controller: `PageMgr.renderPage(pageId, params)`; SFRA has `Page-Show?cid=…`. Pages can be assigned to categories (`PageMgr.getPageByCategory`).\n- Page Designer pages are content assets → they're in libraries and replicate with content.", "standard": "## Content assets and slots\n```js\nvar ContentMgr = require('dw/content/ContentMgr');\nvar asset = ContentMgr.getContent('size-guide');\nif (asset && asset.online) { body = asset.custom.body; }\n```\nSlots in templates:\n```isml\n<isslot id=\"home-hero\" context=\"global\" description=\"Home page hero banner\"/>\n<isslot id=\"cat-banner\" context=\"category\" context-object=\"${pdict.category}\" description=\"Category banner\"/>\n```\nMerchants create slot configurations in Business Manager (Online Marketing › Content Slots) and can schedule them inside campaigns.\n\n## Page Designer files\n```\ncartridge/experience/pages/landing.json\ncartridge/experience/pages/landing.js\ncartridge/experience/components/assets/heroBanner.json\ncartridge/experience/components/assets/heroBanner.js\ncartridge/templates/default/experience/pages/landing.isml\ncartridge/templates/default/experience/components/assets/heroBanner.isml\n```\n`heroBanner.json`:\n```json\n{\n  \"name\": \"Hero banner\",\n  \"group\": \"assets\",\n  \"attribute_definition_groups\": [\n    { \"id\": \"main\", \"name\": \"Content\", \"attribute_definitions\": [\n      { \"id\": \"image\", \"name\": \"Image\", \"type\": \"image\", \"required\": true },\n      { \"id\": \"headline\", \"name\": \"Headline\", \"type\": \"string\" },\n      { \"id\": \"link\", \"name\": \"Link\", \"type\": \"url\" }\n    ] }\n  ],\n  \"region_definitions\": []\n}\n```\n`heroBanner.js`:\n```js\nvar Template = require('dw/util/Template');\nvar HashMap = require('dw/util/HashMap');\nmodule.exports.render = function (context) {\n    var model = new HashMap();\n    model.image = context.content.image;          // dw.experience.image.Image\n    model.headline = context.content.headline;\n    model.link = context.content.link;\n    return new Template('experience/components/assets/heroBanner').render(model).text;\n};\n```\nPage script and template:\n```js\nmodule.exports.render = function (context) {\n    var model = new HashMap();\n    model.page = context.page;\n    model.regions = new (require('*/cartridge/experience/utilities/RegionModelRegistry'))(context.page, require('*/cartridge/experience/pages/landing.json'));\n    return new Template('experience/pages/landing').render(model).text;\n};\n```\n```isml\n<isdecorate template=\"common/layout/page\">\n  <isprint value=\"${pdict.regions.main.render()}\" encoding=\"off\"/>\n<\/isdecorate>\n```\n(Simpler: `PageRenderHelper.renderRegion(pdict.page.getRegion('main'))`.)\n\n## Rules\n- File names: letters, digits, underscores; JSON and JS must match and sit together.\n- Region definitions limit components (`max_components`) and allowed types (inclusions/exclusions).\n- Visibility and scheduling are set by merchants per component.\n- Pages are content: they live in a library and replicate with content."}, {"sources": [["Trailhead: Explore continuous integration", "https://trailhead.salesforce.com/content/learn/modules/b2c-build-processes-and-tests-for-technical-architects/b2c-explore-continuous-integration"], ["Salesforce developers: Governance and quotas", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-governance-and-quotas.html"]], "q": [{"id": "devops-q1", "lv": "basic", "top": true, "q": "How do you deploy code to an instance?", "a": "Build client assets, upload the cartridges into a code version (Prophet, sfcc-ci or B2C CLI using dw.json settings), then activate that code version. For production, deploy to staging and use code replication."}, {"id": "devops-q2", "lv": "basic", "top": true, "q": "Where do you find errors from a storefront request?", "a": "In the error and customerror logs (Log Center in Business Manager or WebDAV Logs folder), filtered by time or request ID."}, {"id": "devops-q3", "lv": "mid", "top": true, "q": "How do you unit test SFCC code that uses dw.* modules?", "a": "Run Mocha in Node and use proxyquire (noCallThru) to replace `dw/...` requires with mocks, testing helper logic without an instance."}, {"id": "devops-q4", "lv": "mid", "top": false, "q": "How do you roll back a bad release?", "a": "Activate the previous code version (on production via code replication history or the code deployment page), or run an undo code replication; then fix forward."}, {"id": "devops-q5", "lv": "mid", "top": false, "q": "Which tools show performance problems?", "a": "Pipeline Profiler (per route timings), Code Profiler, Technical Reports & Dashboards, quota status and logs."}, {"id": "devops-q6", "lv": "adv", "top": false, "q": "How would you design CI/CD for an SFCC project?", "a": "Lint and unit test on every pull request; build and deploy to an on-demand sandbox for integration/browser tests; after merge deploy to development, then to staging with certificate-based auth; replicate to production manually (delivery) or automated (deployment), keeping previous versions for rollback and data deployed via site imports."}], "p": [{"lv": "easy", "t": "Read a log line", "q": "A shopper reports an error at 10:42. Where do you start?", "a": "Log Center → error and customerror logs around 10:42, find the request ID, then follow that ID through other logs (custom, service, quota)."}, {"lv": "std", "t": "Unit test a helper", "q": "Test `isFreeShipping(total)` that compares with site preference `freeShippingThreshold`.", "a": "See the code above: proxyquire `dw/system/Site` with a fake returning 50, and assert boundary values (49.99 false, 50 true, 100 true). Add a case for a missing preference (null) returning false."}], "notes": ["Never commit dw.json, passwords or certificates.", "Keep the previous code version for one-click rollback.", "Put logic in helpers so it can be unit tested with proxyquire."], "id": "devops", "title": "Deployment, debugging, logging and testing", "icon": "bug", "time": {"easy": 7, "crash": 4, "standard": 18}, "summary": "Uploading code, code versions, CI, logs, debugging tools and unit tests.", "easy": "**Getting code onto an instance:** build the front-end files, then upload the cartridges into a **code version** with a tool (the VS Code Prophet extension, the `sfcc-ci` command line tool, or the newer B2C CLI). A small `dw.json` file says which instance and code version to use. Then activate the version.\n\n**Finding problems:**\n- **Logs** in Business Manager (Log Center / Request logs) or over WebDAV: error, warn, custom logs.\n- **Debugger:** set breakpoints in VS Code and step through server code on a sandbox.\n- **Profilers** in Business Manager show which controllers are slow.\n\n**Testing:** SFRA comes with unit tests (Mocha) that run on your computer with fake platform objects, and integration/browser tests that run against a sandbox.", "crash": "- Build: `npm run compile:js`, `compile:scss` (sgmf-scripts/webpack) → `static/`. Lint with ESLint.\n- Upload: Prophet (VS Code), `sfcc-ci code:deploy`, or the B2C CLI; `dw.json` holds hostname, code version, credentials (keep it out of Git). Staging upload needs a client certificate (two-factor).\n- Code versions: Administration › Site Development › Code Deployment; activate; keep the previous for rollback. Activation clears custom caches.\n- Logs: `error-*`, `warn-*`, `customerror-*`, `custom-<prefix>-*`, `quota-*`, `service-*` (communication logs), `jobs-*`; view in Log Center or WebDAV `/Logs`. Request ID ties log lines together.\n- `Logger.getLogger(prefix, category)`; levels set in Custom Log Settings; debug logging off in production.\n- Debugger: script debugger enabled per instance (sandbox), VS Code launch config with the instance credentials.\n- Profiling: Pipeline Profiler (per controller/route timings), Code Profiler, Technical Reports & Dashboards, Quota Status.\n- Unit tests: Mocha + Chai + `proxyquire` to replace `dw/*` modules with mocks; run with `npm test`. Integration tests call routes on a sandbox; browser tests with tools like Cypress or Playwright.\n- CI: feature branch → sandbox (on-demand sandbox can be created per pull request) → development → staging → replication to production.", "standard": "## Build and deploy\n```json\n// dw.json (local only, never commit)\n{ \"hostname\": \"dev01-eu01-acme.demandware.net\", \"code-version\": \"release_2026_11\", \"username\": \"…\", \"password\": \"…\" }\n```\n- Compile client assets: `npm run compile:js && npm run compile:scss` (SFRA's `sgmf-scripts`), lint: `npm run lint`.\n- Upload with Prophet's upload-on-save while developing, or `sfcc-ci code:deploy archive.zip -i <host> --activate` in CI.\n- Staging requires two-factor auth with a **client certificate** for code upload.\n- Activate in Business Manager or via CLI; keep the previous version for rollback.\n\n## Logs\n| Log | Contains |\n|---|---|\n| error / warn | Platform and script errors and warnings |\n| customerror / customwarn | `Logger.error/warn` without a custom file |\n| custom-<prefix> | Your named logs |\n| service-<prefix> | Service communication logs (if enabled) |\n| quota | Quota warnings and violations |\n| jobs | Job execution |\n\nRead them in Business Manager's Log Center or download via WebDAV (`/on/demandware.servlet/webdav/Sites/Logs`). Search by request ID or session ID to follow one request.\n\n## Debugging\nEnable the script debugger on a sandbox, connect from VS Code (Prophet), set breakpoints in controllers and scripts, inspect variables. Never debug on production.\n\n## Unit testing\n```js\n// test/unit/app_custom/scripts/helpers/priceHelper.js\nvar assert = require('chai').assert;\nvar proxyquire = require('proxyquire').noCallThru();\nvar helper = proxyquire('../../../../cartridges/app_custom/cartridge/scripts/helpers/priceHelper', {\n    'dw/system/Site': { getCurrent: function () { return { getCustomPreferenceValue: function () { return 50; } }; } }\n});\ndescribe('priceHelper.isFreeShipping', function () {\n    it('is true at the threshold', function () { assert.isTrue(helper.isFreeShipping(50)); });\n    it('is false below it', function () { assert.isFalse(helper.isFreeShipping(49.99)); });\n});\n```\n`proxyquire` swaps platform modules (`dw/...`) with fakes so the logic runs in Node. Keep logic in helpers to make this easy.\n\n## CI flow\nFeature branch → automated sandbox deploy and tests → merge → development instance → staging (UAT) → data/code replication to production. Don't run tests on staging; don't let test data reach staging."}, {"sources": [["Trailhead: B2C Commerce for developers trail (overview of topics)", "https://trailhead.salesforce.com/"], ["Salesforce developers: B2C Commerce documentation", "https://developer.salesforce.com/docs/commerce/b2c-commerce/overview"]], "q": [{"id": "interview-q1", "lv": "basic", "top": true, "q": "Walk me through what happens when a shopper opens a product page in SFRA.", "a": "The URL maps to `Product-Show`. The web server checks the page cache; on a miss the app server resolves the controller via the cartridge path, middleware runs (cache, consent), the product factory builds the model, `res.render` schedules the template, ISML renders with decorators and includes, and the response is cached according to the cache settings; remote includes are resolved separately."}, {"id": "interview-q2", "lv": "mid", "top": true, "q": "How do you customise SFRA safely so upgrades stay easy?", "a": "Put custom code in your own cartridge on the left, extend controllers with append/prepend (replace only when needed), extend models with module.superModule, use hooks for business logic, keep template overrides minimal, and never edit app_storefront_base or the server module."}, {"id": "interview-q3", "lv": "mid", "top": true, "q": "Tell me how you'd integrate a new payment provider.", "a": "Set up the payment processor and method in Business Manager, implement `app.payment.processor.<id>` Handle/Authorize hooks (or the provider cartridge), call the provider through LocalServiceRegistry with timeouts, use tokens or hosted fields (PCI), handle createOrder → authorise → placeOrder/failOrder, async returns or webhooks, and logging with masking."}, {"id": "interview-   UI.modal({ title: 'Export', body: body, size: 'mid', buttons: [{ label: 'Cancel', onClick: function (m) { m.close(); } }, { label: 'Download', primary: true, onClick: function (m) {
    var list = o.scope === 'one' && only ? [only] : solList();
    if (!list.length) { UI.toast('Nothing to export', true); return; }
    var data = list.map(function (s) {
      var parts = {}; SOL_PARTS.forEach(function (p) { if ((p[0] === 'talking' ? o.talking : o.parts[p[0]]) && s.parts[p[0]]) parts[p[0]] = s.parts[p[0]]; });
      return { title: s.title, date: s.meta.date || '', topics: (s.meta.topics || []).map(function (t) { return (lessonById(t) || { title: t }).title; }), tags: s.meta.tags || '', sections: parts,
        files: s.files.map(function (f) { var inf = fileInfo(f), code = o.strip ? stripComments(f.text, inf.lang) : f.text; return { name: f.name, language: inf.lang, lines: code.split('\n').length, functions: o.info ? inf.fns : undefined, requires: o.info ? inf.reqs : undefined, code: code }; }) };
    });
    var name = (o.scope === 'one' && only ? slug(only.title) : slug(solLabel())) + '-' + new Date().toISOString().slice(0, 10);
    if (o.fmt === 'json') UI.download(name + '.json', JSON.stringify(data, null, 2), 'application/json');
    else {
      var md = data.map(function (s) {
        var t = '# ' + s.title + '\n\n' + (s.date ? '- Date: ' + s.date + '\n' : '') + (s.topics.length ? '- Topics: ' + s.topics.join(', ') + '\n' : '') + (s.tags ? '- Tags: ' + s.tags + '\n' : '') + '\n';
        SOL_PARTS.forEach(function (p) { if (s.sections[p[0]]) t += '## ' + p[1] + '\n\n' + s.sections[p[0]] + '\n\n'; });
        s.files.forEach(function (f) { t += '## File: ' + f.name + '\n\n' + (o.info ? '- Language: ' + f.language + '\n- Lines: ' + f.lines + '\n' + (f.functions && f.functions.length ? '- Functions and routes: ' + f.functions.join(', ') + '\n' : '') + (f.requires && f.requires.length ? '- Requires: ' + f.requires.join(', ') + '\n' : '') + '\n' : '') + '```' + (f.language === 'text' ? '' : f.language) + '\n' + f.code + '\n```\n\n'; });
        return t;
      }).join('\n---\n\n');
      UI.download(name + '.md', md, 'text/markdown');
    }
    m.close(); UI.toast('Export downloaded');
  } }] });
}
/* ---------- requests: report a problem or ask for more ---------- */
var RKINDS = [['more', 'Add more on this'], ['questions', 'More interview questions'], ['wrong', 'Wrong or unclear'], ['other', 'Other']];
function reports() { if (!D.meta.reports) D.meta.reports = []; return D.meta.reports; }
function whereOf(v) {
  if (v.name === 'lesson') { var l = lessonById(v.id); return { label: 'Learn SFCC › ' + (l ? l.title : v.id) + ' (' + MODES.filter(function (x) { return x[0] === lmode(); })[0][1] + ' mode)', view: v }; }
  if (v.name === 'guide') { var g = guideById(v.id); return { label: 'Guide › ' + (g ? g.name : v.id), view: v }; }
  if (v.name === 'learn') return { label: 'Learn SFCC (general)', view: v };
  return { label: labelOf(v).label || 'SFCC Docs', view: v };
}
function reportDialog(v, existing) {
  var r = existing || { kind: 'more', text: '', where: whereOf(v) };
  var body = document.createElement('div'); body.className = 'sfform';
  body.innerHTML = '<div class="small muted" style="margin-bottom:10px">Where: <b>' + esc(r.where.label) + '</b></div>' +
    '<div class="sff"><span>What kind</span><span class="seg">' + RKINDS.map(function (k) { return '<button type="button" data-rk="' + k[0] + '" class="' + (k[0] === r.kind ? 'on' : '') + '">' + k[1] + '</button>'; }).join('') + '</span></div>' +
    '<label class="sff"><span>Details</span><textarea rows="7" data-rt placeholder="What should be added, changed or explained? For example: add how to debug a failing job step, with an example log.">' + esc(r.text) + '</textarea></label>' +
    '<div class="small faint">Saved in this docs folder. Open Requests later and copy them all in one go.</div>';
  body.querySelectorAll('[data-rk]').forEach(function (b) { b.onclick = function () { r.kind = b.getAttribute('data-rk'); body.querySelectorAll('[data-rk]').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
  var btns = [{ label: 'Cancel', onClick: function (m) { m.close(); } }, { label: existing ? 'Save' : 'Add request', primary: true, onClick: function (m) {
    var t = body.querySelector('[data-rt]').value.trim(); if (!t) { UI.toast('Write what you need', true); return; }
    if (existing) { existing.kind = r.kind; existing.text = t; existing.at = Date.now(); }
    else reports().unshift({ id: Date.now().toString(36), at: Date.now(), kind: r.kind, text: t, where: r.where, status: 'open' });
    saveMeta(); m.close(); renderSide(); if (D.view.name === 'reports') render(); UI.toast(existing ? 'Request saved' : 'Request added');
  } }];
  UI.modal({ title: existing ? 'Edit request' : 'Report or request more', body: body, size: 'mid', buttons: btns });
  setTimeout(function () { body.querySelector('[data-rt]').focus(); }, 30);
}
function reportsText(list) {
  var kinds = {}; RKINDS.forEach(function (k) { kinds[k[0]] = k[1]; });
  return 'Requests for SFCC Docs (' + new Date().toISOString().slice(0, 10) + ')\n\n' + list.map(function (r, i) { return (i + 1) + '. [' + r.where.label + '] ' + kinds[r.kind] + ':\n   ' + r.text.replace(/\n/g, '\n   '); }).join('\n\n') + '\n';
}
function pReports(m, v) {
  var all = reports(), filt = v.f || 'open', list = all.filter(function (r) { return filt === 'all' || r.status === filt; });
  var kinds = {}; RKINDS.forEach(function (k) { kinds[k[0]] = k[1]; });
  var h = '<div class="wrap"><div class="crumbs"><a' + vattr({ name: 'home' }) + '>Home</a></div><div class="ptitle">' + ICONS('inbox', 'ic-lg') + '<h1>Requests</h1><span class="grow"></span><button data-copyall' + (list.length ? '' : ' disabled') + '>' + ICONS('copy') + 'Copy ' + (filt === 'open' ? 'open' : 'shown') + ' requests</button><button data-dl' + (list.length ? '' : ' disabled') + '>' + ICONS('download') + 'Download</button><button class="primary" data-new>' + ICONS('plus') + 'New request</button></div>' +
    '<div class="small muted" style="margin:-4px 0 14px">Things to add or fix in the lessons and guides. Copy them and paste them into a chat with Claude to get the content added.</div>' +
    '<div class="row" style="margin-bottom:14px"><span class="seg">' + [['open', 'Open'], ['done', 'Done'], ['all', 'All']].map(function (x) { return '<button data-f="' + x[0] + '" class="' + (x[0] === filt ? 'on' : '') + '">' + x[1] + ' · ' + (x[0] === 'all' ? all.length : all.filter(function (r) { return r.status === x[0]; }).length) + '</button>'; }).join('') + '</span></div>';
  if (!list.length) h += '<div class="card empty"><h2>No ' + (filt === 'all' ? '' : filt + ' ') + 'requests</h2>Use <b>Report or request more</b> on any topic or guide, or New request here.</div>';
  h += list.map(function (r) {
    var i = all.indexOf(r);
    return '<div class="card entry' + (r.status === 'done' ? ' rdone' : '') + '"><div class="row"><span class="etype">' + ICONS(r.kind === 'wrong' ? 'alert' : r.kind === 'questions' ? 'help' : 'plus') + esc(kinds[r.kind] || r.kind) + '</span><a class="small grow" style="cursor:pointer;color:var(--accent-text)"' + vattr(r.where.view || { name: 'home' }) + '>' + esc(r.where.label) + '</a><span class="small faint">' + UI.ago(r.at) + '</span>' +
      '<button class="ghost icon" data-rcopy="' + i + '" title="Copy">' + ICONS('copy') + '</button><button class="ghost icon" data-redit="' + i + '" title="Edit">' + ICONS('edit') + '</button><button class="ghost icon" data-rdone="' + i + '" title="' + (r.status === 'done' ? 'Reopen' : 'Mark as done') + '">' + ICONS(r.status === 'done' ? 'refresh' : 'check') + '</button><button class="ghost icon danger" data-rdel="' + i + '" title="Delete">' + ICONS('trash') + '</button></div>' +
      '<div class="rtext">' + esc(r.text) + '</div></div>';
  }).join('');
  m.innerHTML = h + '</div>';
  m.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { D.view = { name: 'reports', f: b.getAttribute('data-f') }; render(); }; });
  m.querySelector('[data-new]').onclick = function () { reportDialog({ name: 'learn' }); };
  var ca = m.querySelector('[data-copyall]'); if (ca) ca.onclick = function () { copy(reportsText(list)); };
  var dl = m.querySelector('[data-dl]'); if (dl) dl.onclick = function () { UI.download('sfcc-docs-requests-' + new Date().toISOString().slice(0, 10) + '.md', reportsText(list), 'text/markdown'); };
  m.querySelectorAll('[data-rcopy]').forEach(function (b) { b.onclick = function () { copy(reportsText([all[+b.getAttribute('data-rcopy')]])); }; });
  m.querySelectorAll('[data-redit]').forEach(function (b) { b.onclick = function () { var r = all[+b.getAttribute('data-redit')]; reportDialog(r.where.view || { name: 'learn' }, r); }; });
  m.querySelectorAll('[data-rdone]').forEach(function (b) { b.onclick = function () { var r = all[+b.getAttribute('data-rdone')]; r.status = r.status === 'done' ? 'open' : 'done'; saveMeta(); renderSide(); render(); }; });
  m.querySelectorAll('[data-rdel]').forEach(function (b) { b.onclick = function () { var r = all[+b.getAttribute('data-rdel')]; UI.confirm('Delete this request?', esc(first(r.text)), 'Delete', true).then(function (ok) { if (!ok) return; all.splice(all.indexOf(r), 1); saveMeta(); renderSide(); render(); }); }; });
}
function reportBtn() { return '<button class="sm" data-report title="Tell what is missing, wrong or should be added">' + ICONS('inbox') + 'Report or request more</button>'; }
function bindReport(m, v) { var b = m.querySelector('[data-report]'); if (b) b.onclick = function () { reportDialog(v); }; }

/* ---------- start ---------- */
async function pickRoot() {
  try { var h = await window.showDirectoryPicker({ id: 'sfcc-docs', mode: 'readwrite' }); await IDB.set('root', h); await openRoot(h); }
  catch (e) { if (e.name !== 'AbortError') UI.toast(e.message, true); }
}
async function openRoot(h) {
  if ((await h.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await h.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Permission to read the folder was not given.');
  D.root = h; D.rootName = h.name;
  shell(); document.getElementById('main').innerHTML = '<div class="wrap empty">Reading docs…</div>';
  await scan(); D.view = { name: 'home' }; renderSide(); render();
}
async function welcome() {
  var app = document.getElementById('app');
  if (!window.showDirectoryPicker) { app.innerHTML = '<div class="welcome"><div class="logo">' + ICONS('alert') + '</div><h1>Open this file in Chrome or Edge</h1><p class="muted">SFCC Docs uses the browser\'s built-in folder access, which only Chrome and Microsoft Edge support.</p></div>'; return; }
  var last = await IDB.get('root');
  app.innerHTML = '<div class="welcome"><div class="logo">' + ICONS('book') + '</div><h1>SFCC Docs</h1><p class="muted">An offline library for SFCC. Pick the folder where you keep the official schema files, Script API pages saved from your browser, and your own guides. Built-in guides are included.</p>' +
    '<div class="acts">' + (last ? '<button class="primary" id="reopen">' + ICONS('folderOpen') + 'Reopen “' + esc(last.name) + '”</button><button id="pick">Open another folder</button>' : '<button class="primary" id="pick">' + ICONS('folderOpen') + 'Open docs folder</button>') + '</div>' +
    '<div class="safe">' + ICONS('lock') + ' Works offline. Nothing is uploaded and no AI is used.</div><div style="margin-top:18px">' + UI.themeSwitch() + '</div></div>';
  UI.Theme.apply();
  document.getElementById('pick').onclick = pickRoot;
  var re = document.getElementById('reopen');
  if (re) { re.onclick = function () { openRoot(last).catch(function (e) { UI.toast(e.message, true); }); }; try { if ((await last.queryPermission({ mode: 'readwrite' })) === 'granted') openRoot(last); } catch (e) { } }
}
UI.Theme.key = 'sd-theme'; UI.Theme.def = 'dark';
UI.Theme.init();
welcome();
})();

</script>
