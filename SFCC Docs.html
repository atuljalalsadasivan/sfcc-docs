place**: throw the old steps away and write new ones.\n\n**Key words**\n- **Route:** controller name + action, like `Cart-AddProduct`.\n- **Middleware:** one step in the line.\n- **viewData:** the data that goes to the template.", "crash": "- Every controller: `var server = require('server');` … `module.exports = server.exports();`\n- Routes: `server.get('Name', mw1, mw2, fn)` / `server.post(...)` / `server.use(...)` for any method.\n- Middleware signature `(req, res, next)`; always call `next()` unless you deliberately end the chain.\n- `res.render(template, data)`, `res.json(obj)`, `res.redirect(url)`; `res.getViewData()` / `res.setViewData(obj)` (merges).\n- Extend: `var page = module.superModule; server.extend(page);` then `append` / `prepend` / `replace`.\n- `append` = most common (modify view data after base). `prepend` = validation/setup before base. `replace` = when base logic must not run (for example it does a transaction you'd duplicate).\n- Ready-made middleware: `cache.applyDefaultCache`, `csrfProtection.generateToken` / `validateRequest` / `validateAjaxRequest`, `userLoggedIn.validateLoggedIn`, `consentTracking.consent`.\n- `res.render` doesn't render immediately: it's rendered **after** the whole chain finishes, using the final view data.\n- `this.on('route:BeforeComplete', …)` runs code after the chain (SFRA uses it for saving forms in a transaction).", "standard": "## Anatomy\n```js\n'use strict';\nvar server = require('server');\nvar cache = require('*/cartridge/scripts/middleware/cache');\n\nserver.get('Show', cache.applyDefaultCache, function (req, res, next) {\n    var ProductMgr = require('dw/catalog/ProductMgr');\n    var product = ProductMgr.getProduct(req.querystring.pid);\n    if (!product) { res.setStatusCode(404); res.render('error/notFound'); return next(); }\n    res.render('product/simple', { name: product.name });\n    next();\n});\n\nmodule.exports = server.exports();\n```\n- `req.querystring`, `req.form`, `req.httpMethod`, `req.currentCustomer`, `req.locale`, `req.session` …\n- `res.render`, `res.json`, `res.redirect`, `res.setStatusCode`, `res.cachePeriod`, `res.getViewData`, `res.setViewData`.\n\n## How rendering really works\n`res.render()` only records the template and data. SFRA renders after the last middleware, so appended steps can still change view data. That's why `append` works for adding fields to a page.\n\n## Extending a base controller\n```js\nvar server = require('server');\nvar page = module.superModule;      // base Product.js\nserver.extend(page);\n\nserver.append('Show', function (req, res, next) {\n    var viewData = res.getViewData();\n    viewData.deliveryMessage = 'Ships in 24h';\n    res.setViewData(viewData);\n    next();\n});\n\nserver.prepend('Show', function (req, res, next) {\n    if (!req.querystring.pid) { res.redirect(require('dw/web/URLUtils').url('Home-Show')); return next(); }\n    next();\n});\n\nmodule.exports = server.exports();\n```\n\n## Choosing append, prepend or replace\n| Use | When |\n|---|---|\n| `append` | Add or change data shown by the page. Base logic still runs first. |\n| `prepend` | Check permissions or prepare something before the base. |\n| `replace` | Base logic is wrong for you, or is expensive / has side effects (a payment call, a transaction, a service call) that must not run twice. |\n\nAppending after a base that already wrote to the database means both run. If you then redo the work, you get duplicates or double cost. Replace in that case.\n\n## Stopping the chain\nTo stop early, don't call the remaining logic. Render or redirect, then `return next();`. Calling `next(new Error(...))` sends the request to the error handling.\n\n## Events\n`this.on('route:BeforeComplete', function (req, res) { … })` inside a middleware runs at the end of the chain. SFRA uses it to save form data inside `Transaction.wrap` after rendering decisions are made."}, {"sources": [["Salesforce developers: Content cache", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-content-cache.html"], ["Salesforce developers: Caching strategies", "https://developer.salesforce.com/docs/commerce/sfra/guide/caching-strategies-sk.html"]], "q": [{"id": "isml-q1", "lv": "basic", "top": true, "q": "What is pdict?", "a": "The pipeline dictionary: the data object a controller passes to the template with `res.render`. Templates read it as `${pdict.something}`."}, {"id": "isml-q2", "lv": "basic", "top": true, "q": "How do you prevent XSS in ISML?", "a": "Rely on default encoding of `${}` and `<isprint>`, never use `encoding=\"off\"` for untrusted values, and use `SecureEncoder` for JavaScript or other contexts."}, {"id": "isml-q3", "lv": "mid", "top": true, "q": "Local include vs remote include?", "a": "A local include (`template=`) renders another template in the same request and shares pdict. A remote include (`url=`) makes a separate request to a controller, gets only URL parameters, and can have its own cache settings: useful for mixing cached and uncached parts."}, {"id": "isml-q4", "lv": "mid", "top": true, "q": "How does iscache behave when several templates on one page set it?", "a": "The most restrictive setting wins: the shortest duration, or no caching if any of them turns it off. Remote includes are cached separately."}, {"id": "isml-q5", "lv": "mid", "top": false, "q": "How do decorators work?", "a": "The page wraps its content in `<isdecorate template=\"layout\">`; the layout template places that content where it has `<isreplace/>`."}, {"id": "isml-q6", "lv": "mid", "top": false, "q": "How do you show translated text?", "a": "Put keys in `.properties` files under `templates/resources` (per locale) and use `Resource.msg('key','bundle',default)` or `Resource.msgf` for placeholders."}, {"id": "isml-q7", "lv": "adv", "top": false, "q": "A cached product page must show the shopper's name. How?", "a": "Keep the page cached and move the personal part into a remote include pointing at an uncached controller (or load it with client-side AJAX). Never put personal data into a cached response."}], "p": [{"lv": "easy", "t": "Print a value safely", "q": "Print the search term the shopper typed.", "a": "`<isprint value=\"${pdict.searchPhrase}\"/>`. Encoding is on by default, so script tags are shown as text, not run."}, {"lv": "std", "t": "Mixed caching", "q": "The home page should be cached for 24 hours, but the header mini-cart count must be live. Write the template idea.", "a": "Home controller uses `cache.applyDefaultCache` (or `<iscache type=\"relative\" hour=\"24\"/>`). In the header:\n```isml\n<isinclude url=\"${URLUtils.url('Cart-MiniCart')}\"/>\n```\n`Cart-MiniCart` doesn't apply caching, so each page load fetches the live count while the rest comes from the page cache."}], "notes": ["Never turn encoding off for anything a shopper or URL can influence.", "One slow uncached fragment can be split into a remote include so the rest of the page stays cached.", "Keep `<isscript>` out of templates: put logic in models or helpers."], "id": "isml", "title": "ISML templates", "icon": "fileCode", "time": {"easy": 8, "crash": 5, "standard": 20}, "summary": "Printing safely, includes, decorators, page caching tags, slots and resource text.", "easy": "**ISML** is SFCC's template language: normal HTML plus special `<is…>` tags and `${ … }` expressions.\n\n- `${pdict.product.name}` prints a value. **pdict** is the data the controller sent.\n- `<isif condition=\"${…}\"> … <iselse> … <\/isif>` shows parts only when something is true.\n- `<isloop items=\"${list}\" var=\"item\"> … <\/isloop>` repeats for each item.\n- `<isinclude template=\"…\"/>` pulls in another template, like a reusable piece.\n- `<isdecorate template=\"common/layout/page\">` wraps your page in a layout (header and footer) and the layout shows your content where it has `<isreplace/>`.\n- `<isprint value=\"${…}\"/>` prints with safe encoding, so a shopper's text can't inject scripts.\n- `Resource.msg('key', 'file', null)` gets translated text from `.properties` files.\n\nKeep templates for **showing** data. Calculations belong in controllers and models.", "crash": "- `${…}` and `<isprint>` HTML-encode by default. Never use `encoding=\"off\"` with user input (XSS).\n- `<isinclude template=\"x\"/>` = **local include**, rendered in the same request. `<isinclude url=\"${URLUtils.url('Route')}\"/>` = **remote include**, a separate request with its **own cache policy**.\n- `<isdecorate>` + `<isreplace/>` = layout wrapping (SFRA uses `common/layout/page`).\n- `<iscache type=\"relative\" hour=\"24\"/>` caches the page; with several `iscache` tags, the **shortest** setting wins. SFRA usually sets caching in the controller via the cache middleware instead.\n- `<isslot id=\"…\" context=\"global|category|folder\" description=\"…\"/>` = content slot filled by campaigns.\n- `<iscontent type=\"application/json\" charset=\"UTF-8\"/>` sets the response type.\n- `<isscript>` exists, but business logic in templates is a bad practice.\n- Text: `Resource.msg(key, bundle, default)` and `Resource.msgf` for placeholders; files in `templates/resources/bundle_xx_YY.properties`.\n- `<isset name=\"x\" value=\"${…}\" scope=\"page\"/>` sets a variable.", "standard": "## Expressions and pdict\nEverything passed with `res.render('tpl', data)` is available as `pdict.*`. Platform helpers are available too: `URLUtils`, `Resource`, `StringUtils`, `dw.system.Site`.\n\n```isml\n<isdecorate template=\"common/layout/page\">\n    <isinclude template=\"product/components/breadcrumbs\"/>\n    <h1><isprint value=\"${pdict.product.productName}\"/><\/h1>\n    <isif condition=\"${pdict.product.available}\">\n        <button class=\"add-to-cart\">${Resource.msg('button.addtocart', 'common', null)}<\/button>\n    <iselse/>\n        <span>${Resource.msg('label.not.available', 'common', null)}<\/span>\n    <\/isif>\n    <isloop items=\"${pdict.product.images.large}\" var=\"img\" status=\"loop\">\n        <img src=\"${img.url}\" alt=\"${img.alt}\" loading=\"${loop.first ? 'eager' : 'lazy'}\"/>\n    <\/isloop>\n<\/isdecorate>\n```\n\n## Encoding (security)\n`${…}` and `<isprint>` encode HTML by default. `encoding=\"off\"` prints raw HTML. Only use it for trusted, already-sanitised markup (for example Page Designer region output or CMS HTML from Business Manager), never for request parameters or customer input. For JavaScript or attribute contexts use `dw.util.SecureEncoder` (for example `forJavaScript`).\n\n## Local vs remote include\n| | Local `template=` | Remote `url=` |\n|---|---|---|\n| Request | Same request | New request to a controller |\n| Data | Shares pdict | Only URL parameters |\n| Caching | Part of the parent page | Its own cache policy |\n| Cost | Cheap | Extra request; use when caching differs |\n\nTypical use of remote includes: a fully cached product page that includes a small uncached piece (mini-cart, login state).\n\n## Decorators\nThe page template calls `<isdecorate template=\"layout\">`; the layout contains `<isreplace/>` where the page body goes. Several pages share one layout.\n\n## Caching in templates\n`<iscache type=\"relative\" hour=\"1\"/>` (or `type=\"daily\" hour=\"0\"`) marks the page for the web-server page cache. If several `iscache` tags apply (including local includes), the lowest setting wins. Page caching must be enabled for the site. SFRA prefers the controller middleware `cache.applyDefaultCache`, which sets the cache period on the response.\n\n## Slots\n`<isslot id=\"home-main\" context=\"global\" description=\"Home hero\"/>` defines a place merchants fill with content in Business Manager or campaigns. Slot configurations decide what shows, when and for whom.\n\n## Localisation\n`templates/resources/common.properties`, `common_de.properties`, `common_en_GB.properties` hold text. `Resource.msg('key','common',null)` picks the best match for the request locale. Templates can also be localised by folder (`templates/de_DE/…`) but properties files are the common approach."}, {"sources": [["Script API reference", "https://salesforcecommercecloud.github.io/b2c-dev-doc/docs/current/scriptapi/html/index.html"], ["Salesforce developers: SFRA features and components", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-sfra-features-and-comps.html"]], "q": [{"id": "scriptapi-q1", "lv": "basic", "top": true, "q": "Why do you need Transaction.wrap?", "a": "Changes to persistent objects (basket, customer, custom objects, orders) must happen inside a transaction. `Transaction.wrap` commits on success and rolls everything back if the function throws."}, {"id": "scriptapi-q2", "lv": "basic", "top": true, "q": "What is a model in SFRA?", "a": "A JavaScript module that converts platform API objects into plain objects for templates and JSON responses, so templates don't call the Script API directly."}, {"id": "scriptapi-q3", "lv": "basic", "top": false, "q": "How do you read a custom attribute and a site preference?", "a": "Custom attribute: `object.custom.attributeId`. Site preference: `Site.getCurrent().getCustomPreferenceValue('prefId')`."}, {"id": "scriptapi-q4", "lv": "mid", "top": true, "q": "What happens if an exception is thrown inside Transaction.wrap?", "a": "The transaction is rolled back, so none of the changes in that function are saved, and the exception is re-thrown to the caller."}, {"id": "scriptapi-q5", "lv": "mid", "top": false, "q": "getCurrentBasket vs getCurrentOrNewBasket?", "a": "`getCurrentBasket()` returns the existing basket or null. `getCurrentOrNewBasket()` creates one if needed, so use it only when you really need a basket (for example adding to cart), not for just reading."}, {"id": "scriptapi-q6", "lv": "mid", "top": false, "q": "How do you write to your own log file?", "a": "`Logger.getLogger('prefix', 'category')` writes to `custom-prefix-*.log`; use info/warn/error/debug and configure levels in Business Manager."}, {"id": "scriptapi-q7", "lv": "adv", "top": false, "q": "A job updates 200 000 custom objects in one transaction and fails. What's wrong and what's the fix?", "a": "One huge transaction hits size limits, holds locks and can trigger quota errors. Process in chunks (chunk-oriented job step) or commit every N objects with separate transactions."}], "p": [{"lv": "easy", "t": "Save an email", "q": "Save the newsletter email into custom object type `NewsletterSignup` (key = email).", "a": "```js\nvar Transaction = require('dw/system/Transaction');\nvar CustomObjectMgr = require('dw/object/CustomObjectMgr');\nTransaction.wrap(function () {\n    CustomObjectMgr.createCustomObject('NewsletterSignup', email);\n});\n```"}, {"lv": "std", "t": "Safe update with error handling", "q": "Set `basket.custom.giftMessage` from a form and return JSON success or error.", "a": "```js\nserver.post('SaveGiftMessage', csrfProtection.validateAjaxRequest, function (req, res, next) {\n    var BasketMgr = require('dw/order/BasketMgr');\n    var Transaction = require('dw/system/Transaction');\n    var basket = BasketMgr.getCurrentBasket();\n    if (!basket) { res.json({ success: false, error: 'No basket' }); return next(); }\n    try {\n        Transaction.wrap(function () { basket.custom.giftMessage = (req.form.message || '').substring(0, 200); });\n        res.json({ success: true });\n    } catch (e) {\n        require('dw/system/Logger').error('Gift message failed: {0}', e.message);\n        res.json({ success: false, error: 'Could not save' });\n    }\n    next();\n});\n```"}], "notes": ["Read freely, write only inside `Transaction.wrap`.", "Don't pass API objects to the browser: pass models.", "Avoid expensive calls in loops (for example `ProductMgr.getProduct` for every search hit when the search hit already has the data)."], "id": "scriptapi", "title": "Script API, models and transactions", "icon": "braces", "time": {"easy": 10, "crash": 5, "standard": 25}, "summary": "The dw.* packages, SFRA models, Transaction.wrap, and logging.", "easy": "The **Script API** is SFCC's built-in library, written as JavaScript modules starting with `dw/`. You `require` what you need:\n- `dw/catalog/ProductMgr`: find products.\n- `dw/order/BasketMgr`: the shopper's cart (called a **basket**).\n- `dw/customer/CustomerMgr`: customers.\n- `dw/system/Site`: the current site and its settings.\n- `dw/system/Transaction`: save changes.\n\n**Saving data needs a transaction.** Reading is free, but if you change anything stored (a basket, a customer, a custom object), wrap it:\n```js\nTransaction.wrap(function () { basket.setCustomerEmail(email); });\n```\nIf something fails inside, all changes are undone.\n\n**Models** in SFRA turn platform objects into plain data for templates, like a translator: the template gets `product.price.sales.formatted` instead of calling platform objects itself.", "crash": "- Server-side JavaScript (CommonJS `require`), with ES5-ish syntax plus some newer features; no Node modules or browser APIs.\n- Key managers: `ProductMgr`, `CatalogMgr`, `BasketMgr`, `OrderMgr`, `CustomerMgr`, `CustomObjectMgr`, `PromotionMgr`, `ShippingMgr`, `PaymentMgr`, `HookMgr`, `CacheMgr`, `Site`, `URLUtils`, `Resource`, `Logger`, `Transaction`.\n- Writes to persistent objects need `Transaction.wrap(fn)` (or `begin`/`commit`/`rollback`). Errors inside roll back everything.\n- Keep transactions small; huge transactions in jobs cause locking and quota problems.\n- SFRA **models** (`cartridge/models`) convert API objects to plain JSON-like objects; templates and `res.json` use models, not API objects.\n- Custom attributes: `object.custom.myAttr`.\n- Site preferences: `Site.getCurrent().getCustomPreferenceValue('id')`.\n- Logging: `Logger.getLogger('fileprefix', 'category').info(...)`. Custom log files appear as `custom-fileprefix-…log`.\n- Collections are platform types: use `.toArray()`, iterators, or `collections` helper in SFRA.", "standard": "## Packages you'll use daily\n| Package | Highlights |\n|---|---|\n| `dw.catalog` | `ProductMgr.getProduct(id)`, `CatalogMgr.getCategory(id)`, `ProductSearchModel`, `PriceBookMgr` |\n| `dw.order` | `BasketMgr.getCurrentBasket()` / `getCurrentOrNewBasket()`, `OrderMgr`, `ShippingMgr`, `PaymentMgr` |\n| `dw.customer` | `CustomerMgr`, `customer.profile`, address book |\n| `dw.campaign` | `PromotionMgr`, active promotions and plans |\n| `dw.object` | `CustomObjectMgr`, system object metadata |\n| `dw.system` | `Site`, `Transaction`, `Logger`, `HookMgr`, `CacheMgr`, `Status` |\n| `dw.web` | `URLUtils`, `Resource`, `Forms`, `CSRFProtection` |\n| `dw.svc` | `LocalServiceRegistry` for web services |\n| `dw.io` | `File`, `FileReader/Writer`, `XMLStreamReader/Writer`, `CSVStreamReader` |\n| `dw.util` | `Calendar`, `StringUtils`, `HashMap`, `ArrayList`, `Template` |\n\n## Transactions\n```js\nvar Transaction = require('dw/system/Transaction');\nvar CustomObjectMgr = require('dw/object/CustomObjectMgr');\n\nTransaction.wrap(function () {\n    var co = CustomObjectMgr.createCustomObject('NewsletterSignup', email);\n    co.custom.source = 'footer';\n});\n```\n- Anything changing persistent data must be inside a transaction.\n- An exception inside `wrap` rolls the whole transaction back and re-throws.\n- In jobs, commit in batches (for example per 100 items). One transaction over 100 000 items can fail on size limits and locks the objects for a long time.\n\n## Models\nSFRA builds view objects with models and decorators:\n```js\nvar ProductFactory = require('*/cartridge/scripts/factories/product');\nvar product = ProductFactory.get({ pid: req.querystring.pid });\nres.render('product/productDetails', { product: product });\n```\nFactories pick the right model (simple, variant, set, bundle) and decorators add parts (price, images, availability, promotions). Extend them with `module.superModule` (see the Cartridges lesson).\n\n## Custom attributes and preferences\n```js\nvar Site = require('dw/system/Site');\nvar freeShipFrom = Site.getCurrent().getCustomPreferenceValue('freeShippingThreshold');\nvar colour = apiProduct.custom.colourFamily;    // custom attribute on Product\n```\n\n## Logging\n```js\nvar log = require('dw/system/Logger').getLogger('payment', 'adyen');\nlog.info('Auth for order {0} returned {1}', order.orderNo, result.status);\nlog.error('Auth failed: {0}', e.message);\n```\nNever log card data, passwords or full personal data. Set log levels per category in Business Manager (Custom Log Settings)."}, {"sources": [["XML schemas (metadata, customobject)", "https://salesforcecommercecloud.github.io/b2c-dev-doc/docs/current/xsd/"], ["Salesforce developers: Governance and quotas", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-governance-and-quotas.html"]], "q": [{"id": "datamodel-q1", "lv": "basic", "top": true, "q": "What's the difference between a custom attribute and a custom object?", "a": "A custom attribute adds a field to an existing type (like Product). A custom object type is a new type of record with its own key and attributes."}, {"id": "datamodel-q2", "lv": "basic", "top": true, "q": "How do you read a site preference in code?", "a": "`Site.getCurrent().getCustomPreferenceValue('prefId')`. Site preferences are custom attributes of the SitePreferences system object."}, {"id": "datamodel-q3", "lv": "mid", "top": true, "q": "How do you move new attributes and custom object types between instances?", "a": "Export or keep them as metadata XML (system object extensions and custom object type definitions) and import via site import/CLI, or replicate from staging. Avoid manual re-creation per instance."}, {"id": "datamodel-q4", "lv": "mid", "top": false, "q": "Why might a new product attribute not show in Business Manager?", "a": "It hasn't been added to an attribute group for the Product type."}, {"id": "datamodel-q5", "lv": "mid", "top": false, "q": "What is a localizable attribute?", "a": "An attribute that stores one value per locale; code reading it gets the value for the current request locale (with fallback)."}, {"id": "datamodel-q6", "lv": "adv", "top": false, "q": "A team wants to log every add-to-cart event in a custom object. Good idea?", "a": "No. Custom objects are under quotas and storefront writes add transactions on a hot path. Send events to an analytics or external system (client-side or async job), or at least set retention and batch the writes."}], "p": [{"lv": "easy", "t": "Pick the right tool", "q": "Marketing wants a \"Season\" field on products. Custom attribute or custom object?", "a": "A **custom attribute** on the Product system object, ideally an enum-of-string with allowed values, added to an attribute group."}, {"lv": "std", "t": "Design store events", "q": "Stores host events (date, title, store ID). Pages show upcoming events per store. Model it.", "a": "Custom object type `StoreEvent`, key = generated ID string, attributes `storeId`, `date` (datetime), `title` (localizable string), site-scoped, retention for past events. Query with `queryCustomObjects('StoreEvent', 'custom.storeId = {0} AND custom.date > {1}', 'custom.date asc', id, now)`, close the iterator, and cache the result for the store page."}], "notes": ["Add new attributes to an attribute group or merchants won't see them.", "Keep metadata in XML in your repository and import it; don't hand-create on each instance.", "Use retention days on custom objects that are temporary."], "id": "datamodel", "title": "Data model: system objects, custom attributes, custom objects, preferences", "icon": "listCheck", "time": {"easy": 7, "crash": 4, "standard": 18}, "summary": "Where data lives and how to extend it.", "easy": "SFCC already has built-in data types, called **system objects**: Product, Category, Customer, Order, Basket, Site and more.\n\nWhen you need an extra field, say \"fabric\" on Product, you add a **custom attribute** in Business Manager. Code reads it as `product.custom.fabric`.\n\nWhen you need a completely new kind of record, say \"store events\" or \"newsletter sign-ups\", you create a **custom object type**: your own small table.\n\n**Site preferences** are settings that change shop behaviour without new code, like a free-shipping limit. They're custom attributes on the special system object `SitePreferences`.\n\n**Key words**\n- **System object:** built-in type.\n- **Custom attribute:** an extra field on a type.\n- **Custom object:** your own type of record.\n- **Attribute group:** groups fields so they show up in Business Manager.", "crash": "- Extend system objects with custom attributes in **Administration › Site Development › System Object Types**.\n- New attributes must be added to an **attribute group** to appear in Business Manager edit screens.\n- Attribute types: string, text, html, int, double, boolean, date, datetime, email, password, image, enum-of-string/int, set-of-string/int/double.\n- Options: **localizable** (per locale), **site-specific** (product attributes per site), mandatory, externally managed.\n- Custom objects: **Custom Object Types**; key attribute; **storage scope** organization or site; data replication can include them; set a **retention** (days) for temporary data.\n- Code: `CustomObjectMgr.createCustomObject(type, key)`, `getCustomObject`, `queryCustomObjects(type, query, sort, …)`, `remove`.\n- Deploy definitions as **metadata XML** in a site import (`meta/system-objecttype-extensions.xml`, `custom-objecttype-definitions.xml`), not by clicking on each instance.\n- Quotas limit attributes per object type and custom-object counts. Don't use custom objects as a big database or a log.\n- Site preferences: `Site.getCurrent().getCustomPreferenceValue('id')`.", "standard": "## System objects\nBuilt-in types with system attributes (`Product.name`, `Order.orderNo`). You can't remove system attributes, but you can add custom ones to most types: Product, Category, Customer Profile, Order, Basket, ProductLineItem, Store, SitePreferences and more.\n\n## Custom attributes\nCreated under System Object Types › (type) › Attribute Definitions:\n- **Type** decides storage and editing (string, enum-of-string, set-of-string, boolean, date, html …).\n- **Localizable:** one value per locale; read in code for the request locale automatically.\n- **Site-specific** (some product attributes): different value per site.\n- **Externally managed:** not editable in Business Manager, only by import.\n- Add the attribute to an **Attribute Group** to see it in Business Manager.\n\nAccess: `product.custom.fabric`, `order.custom.erpId = 'X'` (inside a transaction).\n\n## Custom objects\nFor business data with no system type: store locator extras, sign-ups, integration queues, redirects.\n- Defined in Custom Object Types with a **key attribute** (string or int) and custom attributes.\n- **Storage scope:** site or organization.\n- **Data replication** setting: replicable or not.\n- **Retention days**: the platform deletes old instances automatically. Use this for temporary or log-like data.\n\n```js\nvar CustomObjectMgr = require('dw/object/CustomObjectMgr');\nvar it = CustomObjectMgr.queryCustomObjects('StoreEvent', 'custom.storeId = {0} AND custom.date > {1}', 'custom.date asc', storeId, new Date());\nwhile (it.hasNext()) { var ev = it.next(); /* … */ }\nit.close();\n```\nAlways close iterators from queries.\n\n## Deploying metadata\nPut definitions in source control as XML (metadata schema) and import with a site archive or the CLI. Clicking them in by hand on each instance leads to drift. Data replication from staging can also carry them.\n\n## Limits\nObject and attribute counts are under quotas. Custom objects are not meant for millions of rows or high-frequency writes from the storefront. Prefer an external system or batch jobs for that."}, {"sources": [["Trailhead: Explore B2C Commerce catalogs", "https://trailhead.salesforce.com/content/learn/modules/b2c-catalog-category-product/b2c-explore-catalogs"], ["Trailhead: Configure price books", "https://trailhead.salesforce.com/content/learn/modules/b2c-pricebooks-images-content/b2c-configure-price-books"], ["Trailhead: Digital product data", "https://trailhead.salesforce.com/content/learn/modules/cc-digital-merchandising/digital-product-data"]], "q": [{"id": "catalog-q1", "lv": "basic", "top": true, "q": "What's the difference between a master catalog and a storefront catalog?", "a": "The master (product) catalog owns the products and their data. The storefront catalog holds the navigation categories, is assigned to a site, and assigns products from the master catalog to its categories."}, {"id": "catalog-q2", "lv": "basic", "top": true, "q": "What conditions must a product meet to appear on a site?", "a": "Assigned to a category in the site's storefront catalog, online (within dates), searchable for listings, priced for quantity 1 in an active price book for the site currency, and present in the search index. Inventory may further decide whether it can be bought."}, {"id": "catalog-q3", "lv": "mid", "top": true, "q": "Master, variant, set and bundle: explain each.", "a": "A master defines variation attributes and isn't bought directly; variants are the purchasable combinations. A set groups products that are bought separately. A bundle is one cart item made of fixed child products with one price."}, {"id": "catalog-q4", "lv": "mid", "top": true, "q": "How do list and sale price books work together?", "a": "Each has one currency. The sale book is \"based on\" (parent) the list book and only contains reduced items. Both are assigned to the site; the storefront shows the sale price where it exists and the list price otherwise."}, {"id": "catalog-q5", "lv": "mid", "top": false, "q": "What is the primary category used for?", "a": "It defines the product's main storefront category, used for breadcrumbs and canonical navigation. Without it the classification category is used."}, {"id": "catalog-q6", "lv": "mid", "top": false, "q": "Why use ProductSearchModel instead of ProductMgr for a category page?", "a": "ProductSearchModel reads the search index, is fast, supports refinements, sorting and paging, and only returns visible products. Loading many products through ProductMgr is slow and can hit quotas."}, {"id": "catalog-q7", "lv": "adv", "top": false, "q": "New products were imported but don't appear in search. What do you check?", "a": "Category assignment in the storefront catalog, online/searchable flags (site-specific), prices in an active price book for the site currency, and whether indexing ran (incremental or SearchReindex job). Also check the import log for errors and that the import ran on the right instance."}], "p": [{"lv": "easy", "t": "Find the buyable item", "q": "A shopper picks \"Red, size M\" of a T-shirt. What's added to the cart: the master or a variant?", "a": "The **variant** that has color=Red and size=M. Masters can't be bought directly."}, {"lv": "std", "t": "Debug a missing product", "q": "Product `SKU-9` exists in Business Manager but doesn't show on the site's category page. Give a checklist with where to look.", "a": "1. Storefront catalog: is SKU-9 assigned to that category? (Catalogs › category › Products)\n2. Product: online for this site, searchable, inside online dates?\n3. Price: a quantity-1 price in an active, site-assigned price book of the site currency?\n4. Variants: for a master, are variants online and priced?\n5. Search index: run or check incremental indexing (Search › Search Indexes) or the SearchReindex job.\n6. Inventory: if the listing filters to orderable products, is there stock (or perpetual)?\n7. Caching: the category page may be cached; wait or invalidate."}], "notes": ["\"Product missing on the site\" is almost always: no storefront category assignment, offline, no price, or index not rebuilt.", "Use search (indexed) for listings; avoid loading thousands of products through ProductMgr in a request.", "Variants are what get added to the cart, not masters."], "id": "catalog", "title": "Products, catalogs, prices, inventory and search", "icon": "shirt", "time": {"easy": 10, "crash": 5, "standard": 25}, "summary": "Product types, catalog structure, how a product becomes visible, price books, inventory and the search index.", "easy": "Picture a big warehouse list and a shop floor plan:\n- The **product (master) catalog** is the warehouse list: every product and its details.\n- The **storefront catalog** is the shop's floor plan: categories like \"Men › Shoes\". You **assign** products from the warehouse list to these categories.\n\nKinds of products:\n- **Standard product:** sold as is.\n- **Master + variants:** one T-shirt (master) with variants per size and colour. Shoppers buy a variant.\n- **Product set:** a \"look\" of several products bought separately.\n- **Bundle:** several products sold together as one item.\n\nA **price book** holds prices in one currency. Usually a **list** price book and a **sale** price book on top of it.\n\n**Inventory lists** hold stock per product. A site uses one list.\n\nThe **search index** is what search and category pages read. After imports, the index needs updating before changes show.", "crash": "- Two catalog roles: **master/product catalog** (owns products, not assigned to a site) and **storefront catalog** (categories, assigned to one site). A product is owned by exactly one catalog.\n- Product visible on a site when: assigned to a storefront category, **online** (and within online dates), **searchable**, has a **price** (qty 1) in an active price book for the site's currency, and is in the **search index**. Availability depends on inventory and code.\n- Product types: standard, **master/variant** (variation attributes like color/size), **variation group**, **product set**, **bundle**, option products (options with their own price).\n- **Primary category** drives breadcrumbs; **classification category** (in the master catalog) drives attributes.\n- Price books: one currency each, assigned to sites, can have a **parent** (\"based on\"). Sale price book on top of list price book. Price tables can be dated and tiered by quantity.\n- Inventory: **inventory list** per site; records with allocation, perpetual flag, pre-order/back-order; ATS (available to sell) is computed.\n- Search: `ProductSearchModel` for listing pages; refinements and sorting rules configured in Business Manager; **SearchReindex** job or incremental indexing after changes.\n- Don't loop `ProductMgr.queryAllSiteProducts()` in storefront code; use search.", "standard": "## Catalogs\n| Catalog | Purpose |\n|---|---|\n| Product (master) catalog | Owns products; mirrors the PIM; not assigned to a site |\n| Storefront (site) catalog | Category tree for navigation; one per site; assigns products owned elsewhere |\n\nA product appears in a site only when its storefront catalog assigns it to a category. Assignments can be done in Business Manager, by import (`category-assignment` in catalog.xml) or by **dynamic categorization rules** (which must be re-run after new products arrive).\n\n## Products\n- **Master** products define **variation attributes** (color, size) and their values. **Variants** are the buyable SKUs. Variation groups (a master filtered to one colour) can be used for listing pages.\n- **Product set:** several products shown together, each added to cart separately.\n- **Bundle:** one cart item with fixed child quantities, one price.\n- **Options:** a choice on a product with its own price (gift wrap, warranty).\n- Online flag and searchable flag can be **site-specific**.\n\n## What makes a product show\n1. Assigned to a storefront category of the site\n2. Online, and inside online-from/to\n3. Searchable (for search and category listing)\n4. Priced in an active price book (currency enabled on the site) for quantity 1\n5. Indexed (search index up to date)\n6. Available, according to inventory and your template logic\n\nWhen a product \"doesn't show\", check those in order.\n\n## Price books\n- One currency per book. Defined org-wide, assigned to sites.\n- A sale book usually has the list book as **parent**: it only holds sale items, the rest falls back.\n- Price tables can have date ranges and quantity tiers.\n- In code: `product.getPriceModel().getPrice()`; SFRA's price factory builds `list` and `sales` prices for templates.\n- Source codes and promotions can also influence prices; customers can get price books via customer groups (applicable price books set in code with `PriceBookMgr.setApplicablePriceBooks`).\n\n## Inventory\n- An **inventory list** per site (Site preferences › Inventory). Records: allocation, perpetual, pre-order/back-order handling, in-stock date.\n- `product.getAvailabilityModel()` gives `isInStock()`, `getInventoryRecord()`, `getAvailabilityStatus()`.\n- Inventory is **reserved** when an order is created from a basket (or earlier if you reserve the basket), and released if the order fails.\n\n## Search\n```js\nvar ProductSearchModel = require('dw/catalog/ProductSearchModel');\nvar psm = new ProductSearchModel();\npsm.setCategoryID('mens-shoes');\npsm.setSearchPhrase('running');\npsm.setOrderableProductsOnly(true);\npsm.search();\nvar hits = psm.getProductSearchHits();\n```\nSFRA wraps this in `search/productSearch` models with refinements and paging. Indexing runs incrementally or with the **SearchReindex** job. Refinements, sorting rules, synonyms and boosting live in Business Manager › Search."}, {"sources": [["Trailhead: Explore campaigns and experience types", "https://trailhead.salesforce.com/content/learn/modules/b2c-campaigns-and-promotions/b2c-explore-campaigns-and-experience-types"], ["Trailhead: Campaigns and promotions", "https://trailhead.salesforce.com/content/learn/modules/cc-digital-merchandising/digital-campaigns-and-promotions"], ["Salesforce developers: Customize promotions", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-promotions-for-developers.html"]], "q": [{"id": "promotions-q1", "lv": "basic", "top": true, "q": "What are the three promotion classes and in what order are they applied?", "a": "Product, then order, then shipping. Order promotions use the subtotal after product discounts."}, {"id": "promotions-q2", "lv": "basic", "top": true, "q": "What qualifiers can a campaign or promotion use?", "a": "Coupons, customer groups and source codes (plus the schedule)."}, {"id": "promotions-q3", "lv": "mid", "top": true, "q": "What do rank and exclusivity do?", "a": "Exclusivity says whether a promotion can combine with others in its class or globally; rank (smaller is stronger) decides which wins when promotions compete."}, {"id": "promotions-q4", "lv": "mid", "top": true, "q": "How are promotions applied in code?", "a": "In the basket calculation (`dw.order.calculate` hook) via `PromotionMgr.applyDiscounts(basket)`, which runs after every basket change."}, {"id": "promotions-q5", "lv": "mid", "top": false, "q": "How do you add a coupon to the basket?", "a": "Inside a transaction call `basket.createCouponLineItem(code, true)`, recalculate the basket, and catch `CreateCouponLineItemException` to show the error code."}, {"id": "promotions-q6", "lv": "adv", "top": false, "q": "Prices on a cached category page show the wrong promotional price for some shoppers. Why?", "a": "The page was cached for one promotion context and served to others. Use promotion-sensitive caching, vary by price book/promotion, or move promotional price display into a remote include or AJAX."}], "p": [{"lv": "easy", "t": "Order of discounts", "q": "Cart has 20% off shoes (product) and 10 off orders over 100 (order). Shoes cost 125. What's the total?", "a": "Product discount first: 125 − 25 = 100. Order promotion checks the new subtotal (100): it qualifies, so 100 − 10 = **90** (plus shipping)."}, {"lv": "std", "t": "\"Spend X more\" message", "q": "Show \"Add 15.00 more for free shipping\" in the cart.", "a": "```js\nvar PromotionMgr = require('dw/campaign/PromotionMgr');\nvar discounts = PromotionMgr.getDiscounts(basket);\nvar approaching = discounts.getApproachingShippingDiscounts(basket.defaultShipment);\n// each item: getDistanceFromConditionThreshold(), getDiscount().getPromotion().calloutMsg\n```\nMap them into the cart model and render the distance with the currency formatter."}], "notes": ["A promotion without a promotion-campaign assignment never runs.", "Always recalculate the basket after adding or removing coupons.", "Use rank and exclusivity on purpose; \"stacking\" bugs are a classic production incident."], "id": "promotions", "title": "Campaigns, promotions and coupons", "icon": "speakerphone", "time": {"easy": 7, "crash": 4, "standard": 18}, "summary": "How discounts are configured, qualified, ordered and applied in code.", "easy": "A **campaign** is like a marketing event, say \"Summer sale, 1–15 July\". Inside it are **promotions**, the actual discount rules: \"20% off shoes\", \"free shipping over 50\".\n\nWho gets the discount is decided by **qualifiers**:\n- a **coupon** code the shopper types,\n- a **customer group** (for example \"registered customers\" or \"VIP\"),\n- a **source code** (the shopper came from a partner link or ad).\n\nThere are three kinds of promotions, applied in this order:\n1. **Product** promotions (on items),\n2. **Order** promotions (on the total),\n3. **Shipping** promotions.\n\n**Rank** and **exclusivity** stop too many discounts stacking up.", "crash": "- Campaign = schedule + qualifiers + experiences (promotions, content slots, sorting rules). Disabled campaign → its promotions are inactive.\n- Qualifiers: **coupons**, **customer groups** (built-in: Everyone, Registered, Unregistered), **source codes**.\n- Classes applied in order: **product → order → shipping**.\n- **Exclusivity:** no exclusivity, class (exclusive within its class), global (exclusive over all). **Rank:** smaller number = higher priority.\n- Coupon types: single code, multiple listed codes, system-generated codes; limits per code, per customer, per time frame.\n- In code, discounts are applied in the **calculate** flow: `PromotionMgr.applyDiscounts(basket)` inside the `dw.order.calculate` hook (SFRA's `basketCalculationHelpers.calculateTotals`).\n- Add a coupon: `basket.createCouponLineItem(code, true)` inside a transaction, then recalculate. Catch `CreateCouponLineItemException` for invalid codes.\n- Approaching (upsell) discounts: `PromotionMgr.getDiscounts(basket).getApproachingOrderDiscounts()` for \"spend X more\" messages.\n- Promotions in a listing price need promotion-aware caching (`cache.applyPromotionSensitiveCache`).", "standard": "## Building blocks\n| Object | Holds |\n|---|---|\n| Campaign | Schedule, qualifiers, customer groups, coupons, source codes; contains experiences |\n| Promotion | Class, condition (what qualifies), discount (what is given), exclusivity, rank, its own qualifiers |\n| Coupon | Codes and redemption limits; used as a qualifier |\n| Customer group | Static list or dynamic rule |\n| Source code group | Codes from affiliates, ads, catalogs |\n\nA promotion inherits the campaign's schedule and qualifiers and can only narrow them.\n\n## Order of application\n1. **Class:** product, then order (on the subtotal after product discounts), then shipping.\n2. **Exclusivity:** whether others in the same class (or any class) can combine.\n3. **Rank:** lower number wins when they compete.\n4. **Discount type and value** decide among equal rank.\n\n## In code\nDiscounts are recalculated whenever the basket changes:\n```js\n// inside dw.order.calculate (SFRA: cartridge/scripts/hooks/cart/calculate.js)\nvar PromotionMgr = require('dw/campaign/PromotionMgr');\nPromotionMgr.applyDiscounts(basket);\n```\nAdding a coupon in a controller:\n```js\nvar Transaction = require('dw/system/Transaction');\nvar HookMgr = require('dw/system/HookMgr');\ntry {\n    Transaction.wrap(function () {\n        basket.createCouponLineItem(code, true);\n        HookMgr.callHook('dw.order.calculate', 'calculate', basket);\n    });\n} catch (e) {\n    // e.errorCode: COUPON_CODE_UNKNOWN, COUPON_DISABLED, CODE_ALREADY_IN_BASKET, REDEMPTION_LIMIT_EXCEEDED …\n}\n```\nShowing promotions on a product page: `PromotionMgr.getActiveCustomerPromotions().getProductPromotions(product)`.\n\n## Caching\nIf prices on cached pages include promotions, use promotion-sensitive caching so pages vary by active promotions, or load promotional prices separately.\n\n## Imports\nCampaigns, promotions and promotion-campaign assignments come in `promotion.xml`; coupons in `coupon.xml`; customer groups in `customergroup.xml`. Import qualifiers first."}, {"sources": [["Script API: OrderMgr", "https://developer.salesforce.com/docs/commerce/b2c-commerce/references/b2c-script-api/dw.order.OrderMgr.html"], ["Salesforce developers: Order management for developers", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-order-management-for-developers.html"], ["Commerce API: Orders", "https://developer.salesforce.com/docs/commerce/commerce-api/references/orders"]], "q": [{"id": "checkout-q1", "lv": "basic", "top": true, "q": "Describe the order placement flow.", "a": "Validate the basket, create the order with `OrderMgr.createOrder` (status CREATED, inventory reserved), authorise payment, then `OrderMgr.placeOrder` on success (status NEW) or `OrderMgr.failOrder` on failure (status FAILED, basket reopened). Then set confirmation and export statuses."}, {"id": "checkout-q2", "lv": "basic", "top": true, "q": "What does dw.order.calculate do?", "a": "It's the hook that recalculates a basket: shipping, promotions, tax and totals. SFRA calls it after every basket change."}, {"id": "checkout-q3", "lv": "mid", "top": true, "q": "What's the difference between order status and export status?", "a": "Order status is the order's lifecycle (CREATED, NEW, OPEN, COMPLETED, CANCELLED, FAILED). Export status tracks whether it has been sent to downstream systems (NOT_EXPORTED, READY, EXPORTED, FAILED)."}, {"id": "checkout-q4", "lv": "mid", "top": true, "q": "How are payment methods and processors connected in SFRA?", "a": "In Business Manager each payment method points to a payment processor. SFRA calls hooks registered as `app.payment.processor.<processorId>` with `Handle` and `Authorize` functions."}, {"id": "checkout-q5", "lv": "mid", "top": false, "q": "What happens when you call failOrder(order, true)?", "a": "The order becomes FAILED, reserved inventory and coupon redemptions are released, and with `true` the basket is reopened so the shopper can retry."}, {"id": "checkout-q6", "lv": "adv", "top": false, "q": "How do you prevent duplicate orders from a double click?", "a": "Disable the button client-side, and on the server check that the basket still exists and hasn't been converted (createOrder removes it), use the order token/number, and make the payment call idempotent with the provider if possible."}, {"id": "checkout-q7", "lv": "adv", "top": false, "q": "How would you integrate an external tax service?", "a": "Implement the `dw.order.calculateTax` hook in your cartridge to call the tax service (through the service framework with a timeout and fallback) and set taxes on line items, keeping the rest of the default calculation."}], "p": [{"lv": "easy", "t": "Which status?", "q": "Payment was declined after createOrder. What do you call and what status does the order get?", "a": "`OrderMgr.failOrder(order, true)` inside a transaction. Status **FAILED**; the basket is reopened."}, {"lv": "std", "t": "Order export job", "q": "Write the core of a job step that exports READY orders and marks them EXPORTED.", "a": "```js\nvar OrderMgr = require('dw/order/OrderMgr');\nvar Order = require('dw/order/Order');\nvar Transaction = require('dw/system/Transaction');\nexports.execute = function () {\n    var orders = OrderMgr.searchOrders('exportStatus = {0} AND status != {1}', 'creationDate asc', Order.EXPORT_STATUS_READY, Order.ORDER_STATUS_FAILED);\n    while (orders.hasNext()) {\n        var o = orders.next();\n        var ok = sendToOms(o);                 // service call\n        Transaction.wrap(function () { o.setExportStatus(ok ? Order.EXPORT_STATUS_EXPORTED : Order.EXPORT_STATUS_FAILED); });\n    }\n    orders.close();\n};\n```\nFor big volumes use a chunk-oriented step instead."}], "notes": ["createOrder before payment, placeOrder after successful payment, failOrder if payment fails.", "Always recalculate the basket after any change; never trust totals sent from the browser.", "Set export status READY when the order is ready for downstream systems."], "id": "checkout", "title": "Basket, checkout and orders", "icon": "coins", "time": {"easy": 10, "crash": 5, "standard": 25}, "summary": "Basket calculation, order creation and placement, payment, statuses and export.", "easy": "The **basket** is the shopping cart. Every time it changes, SFCC **recalculates** it: prices, promotions, shipping, tax, totals.\n\nCheckout in SFRA goes: shipping address and method → billing and payment → place order.\n\nPlacing an order is three steps:\n1. **Create** the order from the basket (status CREATED, stock is reserved, basket is gone).\n2. **Authorise** the payment with the payment provider.\n3. If payment is OK: **place** the order (status NEW). If not: **fail** it (status FAILED, stock released, basket restored).\n\nAfter that, the order is **exported** to the warehouse or order system. Its **export status** tracks that.", "crash": "- Basket recalculation: `HookMgr.callHook('dw.order.calculate', 'calculate', basket)` → shipping, promotions (`PromotionMgr.applyDiscounts`), tax (`dw.order.calculateTax`), totals.\n- Order flow: `OrderMgr.createOrder(basket)` → payment authorisation (payment processor hook) → `OrderMgr.placeOrder(order)` or `OrderMgr.failOrder(order, true)`.\n- `createOrder` → status **CREATED**, inventory reserved, basket removed. Can throw `CreateOrderException`.\n- `placeOrder` → status **NEW** (shown as OPEN later), invoice number, coupon redemptions recorded. Usually then set export status **READY** and confirmation status **CONFIRMED**.\n- `failOrder(order, true)` → **FAILED**, inventory released, basket reopened (true = reopen).\n- Other statuses: OPEN, COMPLETED, CANCELLED (`cancelOrder`), REPLACED. Export status: NOT_EXPORTED, READY, EXPORTED, FAILED. Payment status: NOTPAID, PARTPAID, PAID. Shipping status, confirmation status.\n- Payment: **payment methods** (what shopper picks) map to **payment processors** (who handles it). SFRA calls `hooks.json` entries like `app.payment.processor.<processor_id>` with `Handle` and `Authorize`.\n- All order writes inside transactions. Guard against double submit (place order only once, check order status).\n- Asynchronous payments (redirect to PayPal and back): order stays CREATED until the return; fail it if the shopper abandons.", "standard": "## Basket calculation\nSFRA calls `basketCalculationHelpers.calculateTotals(basket)`, which calls the `dw.order.calculate` hook. The default implementation:\n1. Calculates product prices and shipping (`dw.order.calculateShipping`)\n2. Applies promotions (`PromotionMgr.applyDiscounts`)\n3. Calculates tax (`dw.order.calculateTax`)\n4. Updates totals\n\nOverride parts by registering your own hooks (for example external tax) instead of rewriting the controller.\n\n## Placing an order (SFRA CheckoutServices-PlaceOrder, simplified)\n```js\nvar OrderMgr = require('dw/order/OrderMgr');\nvar Order = require('dw/order/Order');\nvar Transaction = require('dw/system/Transaction');\n\n// validate basket, addresses, payment, inventory …\nvar order;\ntry {\n    order = Transaction.wrap(function () { return OrderMgr.createOrder(basket); });   // CREATED\n} catch (e) { /* CreateOrderException: show error */ }\n\nvar auth = COHelpers.handlePayments(order, order.orderNo);      // calls processor hooks\nif (auth.error) {\n    Transaction.wrap(function () { OrderMgr.failOrder(order, true); });             // FAILED, basket reopened\n    return error();\n}\n\nvar placed = Transaction.wrap(function () {\n    var status = OrderMgr.placeOrder(order);                                          // NEW\n    if (status.isError()) { throw new Error('place failed'); }\n    order.setConfirmationStatus(Order.CONFIRMATION_STATUS_CONFIRMED);\n    order.setExportStatus(Order.EXPORT_STATUS_READY);\n});\n```\n(`COHelpers` = `*/cartridge/scripts/checkout/checkoutHelpers`.)\n\n## Statuses\n| Field | Values |\n|---|---|\n| Order status | CREATED, NEW, OPEN, COMPLETED, CANCELLED, FAILED, REPLACED |\n| Export status | NOT_EXPORTED, READY, EXPORTED, FAILED |\n| Payment status | NOTPAID, PARTPAID, PAID |\n| Confirmation | NOTCONFIRMED, CONFIRMED |\n| Shipping | NOTSHIPPED, PARTSHIPPED, SHIPPED |\n\nExport jobs pick orders with export status READY and set EXPORTED after sending them to the order or warehouse system.\n\n## Payments\n- Business Manager: **Payment Processors** and **Payment Methods** (method → processor, per site).\n- SFRA: each processor ID has hooks in `hooks.json`, for example `app.payment.processor.basic_credit` with `Handle` (store payment info in the basket) and `Authorize` (call the provider, set transaction ID).\n- Never store full card data. Use tokens from the provider (PCI).\n\n## Pitfalls\n- Double clicks creating two orders: disable the button and make the server check the basket/order state.\n- Inventory: reserved at order creation; failing the order releases it. Optionally reserve earlier with `basket.reserveInventory()`.\n- Asynchronous payments: keep the order CREATED while the shopper is away, then place or fail it on return or with a cleanup job."}, {"sources": [["Salesforce developers: SFRA hooks", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-sfra-hooks.html"], ["Salesforce developers: Customization with hooks (SCAPI)", "https://developer.salesforce.com/docs/commerce/commerce-api/guide/extensibility_via_hooks.html"], ["Script API: HookMgr", "https://documentation.b2c.commercecloud.salesforce.com/DOC1/topic/com.demandware.dochelp/DWAPI/scriptapi/html/api/class_dw_system_HookMgr.html"]], "q": [{"id": "hooks-q1", "lv": "basic", "top": true, "q": "What is a hook and how do you register one?", "a": "A named extension point where custom code runs. You register it in a hooks.json file (name + script) that the cartridge's package.json points to."}, {"id": "hooks-q2", "lv": "basic", "top": false, "q": "How do you call a custom hook?", "a": "`HookMgr.callHook('extension.point', 'functionName', args…)`, optionally after checking `HookMgr.hasHook`."}, {"id": "hooks-q3", "lv": "mid", "top": true, "q": "If two cartridges register dw.order.calculateTax, which runs?", "a": "Both. All registered hooks for an extension point run, in the order of the cartridges on the cartridge path."}, {"id": "hooks-q4", "lv": "mid", "top": true, "q": "What are before, after and modifyResponse hooks in OCAPI/SCAPI?", "a": "`before` validates or rejects input, `after` changes data inside the request's transaction, and `modify…Response` changes the returned JSON document."}, {"id": "hooks-q5", "lv": "adv", "top": false, "q": "Why could returning a value from an API hook break things?", "a": "For these hooks a returned value can be treated as the result and skip remaining registered hooks and the default implementation. Return nothing (or a Status OK where expected) to let processing continue."}], "p": [{"lv": "easy", "t": "Register a hook", "q": "Write the hooks.json entry to run `./hooks/orderNo.js` for custom order numbers.", "a": "```json\n{ \"hooks\": [ { \"name\": \"dw.order.createOrderNo\", \"script\": \"./hooks/orderNo.js\" } ] }\n```\nand `exports.createOrderNo = function () { return 'WEB' + … ; };`"}, {"lv": "std", "t": "Add a custom field to the SCAPI basket response", "q": "Headless app needs `c_deliveryEstimate` on GET basket.", "a": "Register `dw.ocapi.shop.basket.modifyGETResponse`:\n```js\nexports.modifyGETResponse = function (basket, basketResponse) {\n    basketResponse.c_deliveryEstimate = estimate(basket);   // keep it cheap\n};\n```\nReturn nothing so default processing continues."}], "notes": ["Every cartridge's implementation of a hook runs: duplicates can double-apply logic.", "Keep hook code quick, with no unnecessary database reads.", "Prefer hooks over replacing controllers when the platform offers an extension point."], "id": "hooks", "title": "Hooks and extension points", "icon": "link", "time": {"easy": 6, "crash": 4, "standard": 15}, "summary": "hooks.json, system hooks, OCAPI/SCAPI hooks and your own extension points.", "easy": "A **hook** is a named \"plug-in socket\" in SFCC. The platform (or your code) says \"at this moment, run whatever is plugged into the socket called X\".\n\nYou plug in your code by listing it in **hooks.json**:\n```json\n{ \"hooks\": [ { \"name\": \"dw.order.calculateTax\", \"script\": \"./hooks/tax.js\" } ] }\n```\nand pointing to that file from your cartridge's `package.json`.\n\nThree kinds:\n- **System hooks:** platform business logic like basket calculation or payment (`dw.order.calculate`).\n- **API hooks:** run before or after headless API calls (`dw.ocapi.shop.basket.afterPOST`).\n- **Custom hooks:** your own sockets, called with `HookMgr.callHook('app.something', 'fn', args)`.", "crash": "- Register in `cartridge/scripts/hooks.json`, referenced by `\"hooks\": \"./cartridge/scripts/hooks.json\"` in the cartridge's `package.json`.\n- Each entry: `name` (extension point) + `script` (module exporting the function).\n- Call: `HookMgr.callHook(extensionPoint, functionName, args…)`; check with `HookMgr.hasHook(extensionPoint)`.\n- If several cartridges register the same hook, **all run**, in cartridge path order. Within one hooks.json you can't control order.\n- System hooks: `dw.order.calculate`, `dw.order.calculateShipping`, `dw.order.calculateTax`, `dw.order.createOrderNo`, payment hooks (`dw.order.payment.authorize`, …).\n- SFRA payment uses custom hooks `app.payment.processor.<id>` with `Handle` / `Authorize`.\n- OCAPI/SCAPI hooks: `before…` (validate input), `after…` (change data, still in transaction), `modify…Response` (shape the JSON). Names keep the `dw.ocapi.shop.*` prefix for both APIs.\n- API hooks returning a Status with error stop the request; returning **any value** from some hooks skips later registered hooks and the system default. Return nothing to continue.\n- Keep hooks fast: they run on every matching request.", "standard": "## Registering\n```json\n// app_custom/package.json\n{ \"name\": \"app_custom\", \"hooks\": \"./cartridge/scripts/hooks.json\" }\n```\n```json\n// app_custom/cartridge/scripts/hooks.json\n{\n  \"hooks\": [\n    { \"name\": \"dw.order.calculateTax\", \"script\": \"./hooks/taxCalc.js\" },\n    { \"name\": \"dw.ocapi.shop.basket.modifyGETResponse\", \"script\": \"./hooks/basketResponse.js\" },\n    { \"name\": \"app.checkout.validate\", \"script\": \"./hooks/checkoutValidate.js\" }\n  ]\n}\n```\n```js\n// hooks/taxCalc.js\nexports.calculateTax = function (basket) {\n    // call the tax service, set taxes on line items …\n    return new (require('dw/system/Status'))(require('dw/system/Status').OK);\n};\n```\n\n## Calling custom hooks\n```js\nvar HookMgr = require('dw/system/HookMgr');\nif (HookMgr.hasHook('app.checkout.validate')) {\n    var status = HookMgr.callHook('app.checkout.validate', 'validate', basket);\n    if (status && status.error) { /* stop */ }\n}\n```\nCustom hooks let integration cartridges plug into your checkout without you editing their code (and vice versa).\n\n## Running order\nAll registered implementations of an extension point run, across cartridges in path order. Don't rely on order inside one hooks.json.\n\n## OCAPI / SCAPI hooks\n| Hook | Use |\n|---|---|\n| `before<METHOD>` | Validate or reject input early |\n| `after<METHOD>` | Change persistent data; runs in the request transaction |\n| `modify<METHOD>Response` | Add or remove fields in the response document (for example `c_` custom properties) |\n\nThe same hook names (with the historical `dw.ocapi.shop` prefix) run for SCAPI and OCAPI shopper calls. Return a `Status` with error to fail the request; returning a value can stop later hooks and the system implementation, so return `undefined` when you want processing to continue."}, {"sources": [["Trailhead: Build a B2C Commerce web service integration", "https://trailhead.salesforce.com/content/learn/modules/salesforce-b2c-commerce-third-party-integration-strategies-2/build-a-b2c-commerce-web-service-integration"], ["Trailhead: Learn the web services framework", "https://trailhead.salesforce.com/content/learn/modules/b2c-integration-approaches/b2c-learn-web-services-framework"]], "q": [{"id": "services-q1", "lv": "basic", "top": true, "q": "What three Business Manager objects make up a service?", "a": "The credential (URL and authentication), the profile (timeout, rate limit, circuit breaker) and the service definition itself (ID, type, mode, logging) that links them."}, {"id": "services-q2", "lv": "basic", "top": true, "q": "What is a circuit breaker?", "a": "A protection that stops calling a service after too many failures within an interval, returning \"unavailable\" immediately for a while so the storefront isn't slowed down by a broken partner."}, {"id": "services-q3", "lv": "mid", "top": true, "q": "Rate limit vs circuit breaker?", "a": "Rate limiting caps how many calls are allowed per interval regardless of success. The circuit breaker reacts to failures and suspends calls when too many fail."}, {"id": "services-q4", "lv": "mid", "top": true, "q": "What callbacks does createService take?", "a": "Mainly `createRequest` (build the request, return the body) and `parseResponse` (turn the response into a result). Optional: `mockCall` for mocked mode, `filterLogMessage` and log message callbacks, `execute` and `initServiceClient` for special cases."}, {"id": "services-q5", "lv": "mid", "top": false, "q": "How do you test without the real partner?", "a": "Implement `mockCall` and set the service mode to mocked in Business Manager; createRequest and parseResponse still run, so your logic is tested."}, {"id": "services-q6", "lv": "adv", "top": false, "q": "A tax provider is slow during sales and checkout times out. What do you do?", "a": "Lower and tune the timeout, keep the circuit breaker on, add a fallback (estimated tax with recalculation later, or a clear retry message), cache what's cacheable, and agree on SLAs. Monitor service logs and quota/timeouts."}], "p": [{"lv": "easy", "t": "Read a result", "q": "`result.ok` is false and `result.unavailableReason` is `CIRCUIT_BROKEN`. What happened?", "a": "Too many recent calls failed, so the circuit breaker opened and SFCC didn't even call the partner. Show a fallback and check the partner's health."}, {"lv": "std", "t": "Write a POST service", "q": "Send `{orderNo, total}` as JSON to an ERP and return its ID.", "a": "```js\nvar svc = LocalServiceRegistry.createService('int_erp.http.order.create', {\n    createRequest: function (s, order) {\n        s.setRequestMethod('POST');\n        s.addHeader('Content-Type', 'application/json');\n        return JSON.stringify({ orderNo: order.orderNo, total: order.totalGrossPrice.value });\n    },\n    parseResponse: function (s, client) { return JSON.parse(client.text).id; }\n});\nvar r = svc.call(order);\nvar erpId = r.ok ? r.object : null;\n```"}], "notes": ["Never rely on default timeouts; set an explicit low value.", "Handle the not-ok result every time; the partner will be down one day.", "Mask secrets and personal data in logs with filterLogMessage."], "id": "services", "title": "Web services (service framework)", "icon": "world", "time": {"easy": 7, "crash": 4, "standard": 18}, "summary": "LocalServiceRegistry, service configuration, profiles, credentials, mocking, timeouts, circuit breaker and rate limits.", "easy": "When SFCC needs to talk to another system (payment, tax, loyalty, ERP), it uses the **service framework**.\n\nIn Business Manager (Administration › Operations › Services) you set up three things:\n- **Credential:** the URL and login.\n- **Profile:** safety settings: how long to wait (**timeout**), how many calls are allowed (**rate limit**), and when to stop calling a broken service (**circuit breaker**).\n- **Service:** a name (ID) that ties a credential and a profile together.\n\nIn code you create the service with the same ID, describe how to build the request and read the response, then call it:\n```js\nvar svc = LocalServiceRegistry.createService('loyalty.http.points', { createRequest: …, parseResponse: … });\nvar result = svc.call({ customerNo: '123' });\nif (result.ok) { … }\n```\nThe circuit breaker is like a fuse: if the other system keeps failing, SFCC stops calling it for a while so your shop stays fast.", "crash": "- `dw.svc.LocalServiceRegistry.createService(id, callbacks)`; `ServiceRegistry` (global) is deprecated.\n- Callbacks: `createRequest(svc, args)` (set URL, method, headers, return body), `parseResponse(svc, client)` (return result object), `mockCall(svc, request)` (fake response for tests; createRequest and parseResponse still run), `filterLogMessage(msg)` (mask secrets), `getRequestLogMessage` / `getResponseLogMessage`.\n- `service.call(args)` returns `dw.svc.Result`: `ok`, `status` (OK, ERROR, SERVICE_UNAVAILABLE), `object`, `error`, `errorMessage`, `unavailableReason` (TIMEOUT, RATE_LIMITED, CIRCUIT_BROKEN, DISABLED, CONFIG_PROBLEM).\n- Business Manager: Service (ID, type HTTP/SOAP/FTP/SFTP/generic, mode live/mocked, enabled, logging, log prefix) + Profile (timeout, rate limit calls/interval, circuit breaker calls/interval) + Credential (URL, user, password).\n- **Always set an explicit low timeout**; platform defaults are long. Keep circuit breaker on.\n- Rate limiter and circuit breaker are checked **before** the call; when tripped no call is made.\n- Communication log for debugging; never log personal or card data; turn logging down in production.\n- Service IDs convention: `cartridge.type.action` (for example `int_tax.http.calculate`).", "standard": "## Business Manager setup\n| Part | Settings |\n|---|---|\n| Credential | URL, user, password (or certificates) |\n| Profile | Timeout (ms), Rate limit (max calls per interval), Circuit breaker (max failed calls per interval) |\n| Service | ID, type, enabled, mode (live or mocked), communication log, log name prefix; links one credential and one profile |\n\nServices can share profiles. Credentials can be swapped per instance (sandbox vs production URL) without code changes.\n\n## Code\n```js\nvar LocalServiceRegistry = require('dw/svc/LocalServiceRegistry');\n\nvar pointsService = LocalServiceRegistry.createService('int_loyalty.http.points', {\n    createRequest: function (svc, args) {\n        svc.setRequestMethod('GET');\n        svc.addHeader('Accept', 'application/json');\n        svc.setURL(svc.getConfiguration().getCredential().getURL() + '/customers/' + encodeURIComponent(args.customerNo) + '/points');\n        return null;                          // GET has no body\n    },\n    parseResponse: function (svc, client) {\n        return JSON.parse(client.text);\n    },\n    mockCall: function () {\n        return { statusCode: 200, statusMessage: 'OK', text: '{\"points\": 120}' };\n    },\n    filterLogMessage: function (msg) {\n        return msg.replace(/\"email\":\"[^\"]*\"/g, '\"email\":\"***\"');\n    }\n});\n\nvar result = pointsService.call({ customerNo: customer.profile.customerNo });\nif (result.ok) {\n    points = result.object.points;\n} else {\n    Logger.warn('Points unavailable: {0} {1}', result.status, result.unavailableReason || result.errorMessage);\n    points = null;                            // show the page without points\n}\n```\n\n## Resilience\n- **Timeout:** fail fast so a slow partner doesn't block your threads. Choose it from the partner's SLA.\n- **Circuit breaker:** after N failures in the interval the service is considered down; calls return SERVICE_UNAVAILABLE immediately for a while.\n- **Rate limiter:** caps calls per interval; useful for partners with quotas.\n- **Fallback:** always handle `!result.ok` gracefully: hide the widget, use cached data, or queue the work for a job.\n- **Cache** stable responses (custom cache) to reduce calls.\n\n## Where to call services\nAvoid synchronous partner calls on cached pages and hot paths. Prefer jobs for bulk sync, and client-side or remote includes for optional widgets."}, {"sources": [["Salesforce developers: Create custom job step types", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-custom-job-steps.html"], ["Trailhead: Create custom job steps", "https://trailhead.salesforce.com/content/learn/modules/b2c-admin-create-and-manage-jobs/b2c-admin-create-custom-job-steps"], ["Trailhead: System job steps", "https://trailhead.salesforce.com/content/learn/modules/b2c-admin-create-and-manage-jobs/b2c-admin-explore-system-job-steps"]], "q": [{"id": "jobs-q1", "lv": "basic", "top": true, "q": "What is the difference between task-oriented and chunk-oriented job steps?", "a": "A task step runs one `execute` function for the whole work. A chunk step reads, processes and writes items in batches of a set size, which suits large data, gives progress tracking and commits per chunk."}, {"id": "jobs-q2", "lv": "basic", "top": true, "q": "Where do you define custom job steps?", "a": "In steptypes.json (or steptypes.xml) in the root of a cartridge: step type ID, module, functions, parameters, contexts and status codes."}, {"id": "jobs-q3", "lv": "mid", "top": true, "q": "What functions does a chunk-oriented step module provide?", "a": "Required read, process and write; optional beforeStep, afterStep, getTotalCount, beforeChunk and afterChunk. read returns the next item or nothing, process transforms or filters, write receives the chunk's list."}, {"id": "jobs-q4", "lv": "mid", "top": false, "q": "Can a chunk step return a custom exit status?", "a": "No, chunk-oriented steps end with OK or ERROR. Use a task-oriented step if you need custom exit codes for flow control."}, {"id": "jobs-q5", "lv": "mid", "top": false, "q": "How do files get into an import job?", "a": "External systems upload them via WebDAV or SFTP into IMPEX/src (a subfolder per feed), and the job step reads them from there with a file name pattern."}, {"id": "jobs-q6", "lv": "adv", "top": false, "q": "A nightly job updating 300 000 products takes hours and sometimes fails at the end, losing all work. Fix it.", "a": "Convert it to a chunk-oriented step with a sensible chunk size so each chunk commits separately; stream input; avoid per-item expensive lookups; close iterators; consider splitting by site or category in parallel flows; and use system import steps if it's plain data loading."}], "p": [{"lv": "easy", "t": "Pick a step", "q": "You need to load a price book XML every night from IMPEX/src/prices. Custom or system step?", "a": "**System step ImportPriceBook**, with WorkingFolder `prices`, a FileNamePattern and Merge mode. No code needed."}, {"lv": "std", "t": "Write the steptypes entry", "q": "Register a task step `custom.CleanSignups` (deletes old newsletter sign-up objects) with an integer parameter `Days`, site context only.", "a": "```json\n{ \"step-types\": { \"script-module-step\": [ {\n  \"@type-id\": \"custom.CleanSignups\",\n  \"@supports-site-context\": \"true\",\n  \"@supports-organization-context\": \"false\",\n  \"module\": \"app_custom/cartridge/scripts/steps/cleanSignups.js\",\n  \"function\": \"execute\",\n  \"parameters\": { \"parameter\": [ { \"@name\": \"Days\", \"@type\": \"long\", \"@required\": \"true\" } ] }\n} ] } }\n```"}], "notes": ["Use chunk-oriented steps for large data sets: smaller transactions, progress, restartability.", "Put steptypes.json in the cartridge root and the cartridge on the right cartridge path.", "Close iterators (`SeekableIterator.close()`) when done."], "id": "jobs", "title": "Jobs, import/export and replication", "icon": "refresh", "time": {"easy": 8, "crash": 4, "standard": 20}, "summary": "The job framework, custom steps (task and chunk), IMPEX and WebDAV, and how data reaches production.", "easy": "A **job** is a background task SFCC runs on a schedule or on demand: importing prices every night, exporting orders every 15 minutes, rebuilding the search index.\n\nA job is made of **steps**. Some are ready-made (**system steps** like ImportCatalog), and some you write yourself (**custom steps**).\n\nCustom steps come in two styles:\n- **Task-oriented:** one function does the whole job. Simple.\n- **Chunk-oriented:** read one item, process it, and write items in batches (chunks). Best for thousands of products or orders, and shows progress.\n\nFiles to import go into a server folder called **IMPEX** (usually `IMPEX/src`), uploaded with **WebDAV** or SFTP.", "crash": "- Jobs: Administration › Operations › Jobs. Flows (sequential or parallel sibling flows), schedules, triggers, failure handling, job resources (locks), job history.\n- Scope: **organization** or **site** context per step.\n- Custom steps: CommonJS module + **steptypes.json** in the cartridge **root** (one per cartridge), cartridge on the path of the Business Manager site / job context.\n- Task-oriented: `\"module\": \"...\", \"function\": \"execute\"`; returns `dw.system.Status`; can define custom exit statuses.\n- Chunk-oriented: `read-function`, `process-function`, `write-function`, optional `before-step-function`, `after-step-function`, `total-count-function`, `before-chunk-function`, `after-chunk-function`; `chunk-size`. `read` returns one item or nothing; `process` returns item or nothing (filters); `write` gets a list. Finishes OK or ERROR only (no custom exit status).\n- Step parameters defined in steptypes.json (`@type`, `@required`, `enum-values`…), read via `parameters.Name`.\n- File paths: `File.IMPEX + '/src/…'`, `dw.io.File`, readers/writers (`XMLStreamWriter`, `CSVStreamWriter`).\n- System steps: ImportCatalog, ImportPriceBook, ImportInventoryLists, ImportSiteArchive, SearchReindex, ExportOrders, SiteExport, Execute/Undo replication processes, IncludeStepsFromJob.\n- Replication: staging → development/production; data or code; transfer + publish; scheduled or as job step.", "standard": "## steptypes.json\n```json\n{\n  \"step-types\": {\n    \"script-module-step\": [{\n      \"@type-id\": \"custom.ExportNewsletter\",\n      \"@supports-site-context\": \"true\",\n      \"@supports-organization-context\": \"false\",\n      \"module\": \"int_newsletter/cartridge/scripts/steps/exportNewsletter.js\",\n      \"function\": \"execute\",\n      \"parameters\": { \"parameter\": [ { \"@name\": \"FileName\", \"@type\": \"string\", \"@required\": \"true\" } ] },\n      \"status-codes\": { \"status\": [ { \"@code\": \"OK\" }, { \"@code\": \"ERROR\" }, { \"@code\": \"NO_DATA\" } ] }\n    }],\n    \"chunk-script-module-step\": [{\n      \"@type-id\": \"custom.DeactivateOldProducts\",\n      \"@supports-site-context\": \"true\",\n      \"@supports-organization-context\": \"false\",\n      \"module\": \"app_custom/cartridge/scripts/steps/deactivate.js\",\n      \"before-step-function\": \"beforeStep\",\n      \"read-function\": \"read\",\n      \"process-function\": \"process\",\n      \"write-function\": \"write\",\n      \"after-step-function\": \"afterStep\",\n      \"total-count-function\": \"getTotalCount\",\n      \"chunk-size\": 100\n    }]\n  }\n}\n```\nOnly one steptypes.json (or steptypes.xml) per cartridge, in its root. Errors in it are logged and the steps are not registered.\n\n## Chunk module\n```js\nvar ProductMgr = require('dw/catalog/ProductMgr');\nvar Transaction = require('dw/system/Transaction');\nvar products;\nexports.beforeStep = function (params, stepExecution) { products = ProductMgr.queryAllSiteProducts(); };\nexports.getTotalCount = function () { return products.count; };\nexports.read = function () { return products.hasNext() ? products.next() : undefined; };\nexports.process = function (p) { return isOld(p) ? p : undefined; };     // undefined = skip\nexports.write = function (lines) {\n    Transaction.wrap(function () { lines.toArray().forEach(function (p) { p.setOnlineFlag(false); }); });\n};\nexports.afterStep = function (success) { products.close(); };\n```\nEach chunk is written (and committed) separately, so one failure doesn't roll back hours of work, and progress is visible in job history.\n\n## Task module\n```js\nvar Status = require('dw/system/Status');\nexports.execute = function (params, stepExecution) {\n    var file = new (require('dw/io/File'))(require('dw/io/File').IMPEX + '/src/newsletter/' + params.FileName);\n    // … write CSV …\n    return new Status(Status.OK);         // or new Status(Status.OK, 'NO_DATA')\n};\n```\n\n## Files: IMPEX and WebDAV\n- WebDAV root folders: Impex (`/on/demandware.servlet/webdav/Sites/Impex`), Cartridges, Logs, Catalogs, Libraries, Static.\n- Imports read from `IMPEX/src/...`; system steps archive processed files.\n- Use streaming readers/writers for big files; don't read whole files into memory.\n\n## Replication\nData and code are replicated from staging. Configure processes in Administration › Replication (data or code), pick tasks (global and site), choose transfer and publish, run now, schedule, or call from a job with ExecutePreconfiguredDataReplicationProcess."}, {"sources": [["Salesforce developers: Get started with SCAPI", "https://developer.salesforce.com/docs/commerce/b2c-commerce/guide/scapi-get-started.html"], ["Salesforce developers: Why use SCAPI instead of OCAPI", "https://developer.salesforce.com/docs/commerce/sfra/guide/why-use-scapi.html"], ["Salesforce developers: SLAS overview", "https://developer.salesforce.com/docs/commerce/commerce-api/guide/slas.html"], ["Salesforce developers: Custom APIs", "https://developer.salesforce.com/docs/commerce/b2c-commerce/guide/custom-apis.html"]], "q": [{"id": "apis-q1", "lv": "basic", "top": true, "q": "What's the difference between OCAPI and SCAPI?", "a": "OCAPI is the older REST API (Shop, Data, Meta) configured via OCAPI settings. SCAPI is the newer API family (Shopper, Admin, Custom APIs) with SLAS OAuth for shoppers; it's the default for new headless work."}, {"id": "apis-q2", "lv": "basic", "top": true, "q": "What is SLAS?", "a": "Shopper Login and API Access Service: the OAuth service that issues access and refresh tokens to shoppers (guest or registered) for the SCAPI Shopper APIs."}, {"id": "apis-q3", "lv": "mid", "top": true, "q": "When do you use a public vs a private SLAS client?", "a": "Public when the app can't keep a secret (single-page web app, mobile app): it uses PKCE. Private when a trusted server or BFF holds the secret: it can use client_credentials for guests."}, {"id": "apis-q4", "lv": "mid", "top": true, "q": "How do you extend SCAPI?", "a": "With hooks (before/after/modifyResponse on existing endpoints) and with Custom APIs: an OAS 3 contract plus script implementation in a cartridge, exposed as new endpoints."}, {"id": "apis-q5", "lv": "mid", "top": false, "q": "How is OCAPI access controlled?", "a": "Through OCAPI settings (JSON) in Business Manager, global or per site, listing for each client ID which resources and methods are allowed."}, {"id": "apis-q6", "lv": "adv", "top": false, "q": "A team plans to call Admin APIs from the browser to update a wishlist. Problem?", "a": "Admin APIs need Account Manager credentials that must never be exposed to browsers. Use Shopper APIs (Shopper Product Lists) with SLAS tokens, or a Shopper Custom API, or a BFF that holds credentials."}], "p": [{"lv": "easy", "t": "Pick the API", "q": "A mobile app needs product search and a cart. Which API group and auth?", "a": "**SCAPI Shopper APIs** (Shopper Search, Shopper Baskets) with a **SLAS public client** using PKCE."}, {"lv": "std", "t": "Expose loyalty points headlessly", "q": "The composable storefront must show a shopper's l
