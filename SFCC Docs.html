<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Offline only: this policy blocks every network request (no internet, no CDN, no tracking). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; frame-src blob:; object-src blob:; base-uri 'none'; form-action 'none'">
<title>SFCC Docs</title>
<style>
:root{
  --bg:#f5f5f3;--panel:#ffffff;--panel2:#f0efeb;--hover:#ecebe6;--text:#1f1f1d;--muted:#66655f;--faint:#9a9890;
  --border:#e3e1da;--border2:#cbc9c0;--accent:#4f46e5;--accent-h:#4338ca;--accent-bg:#eceafd;--accent-text:#3730a3;--on-accent:#fff;
  --danger:#b42318;--danger-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fdf3dc;--ok:#2f6b12;--ok-bg:#e9f4df;--hl:#ffe98a;--hl-text:#1f1f1d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:8px;--shadow:0 10px 40px rgba(0,0,0,.18);
  --c1-bg:#fdeaea;--c1-fg:#7a1f1f;--c1-st:#f4bcbc;--c1:#e24b4a;
  --c2-bg:#e8f3dc;--c2-fg:#27500a;--c2-st:#bfdc95;--c2:#5e9620;
  --c3-bg:#fbede6;--c3-fg:#712b13;--c3-st:#f3c2ae;--c3:#d85a30;
  --c4-bg:#efedfd;--c4-fg:#3c3489;--c4-st:#cfcaf6;--c4:#7f77dd;
  --c5-bg:#e6f1fb;--c5-fg:#0c447c;--c5-st:#b5d4f4;--c5:#378add;
  --tk-kw:#a626a4;--tk-str:#2e7d32;--tk-num:#b45309;--tk-com:#8a8a85;--tk-tag:#c2410c;--tk-attr:#1d4ed8;
}
[data-theme=dark]{
  --bg:#17171a;--panel:#212125;--panel2:#2a2a2f;--hover:#2f2f35;--text:#ecebe6;--muted:#a9a8a2;--faint:#76756f;
  --border:#34343a;--border2:#4a4a52;--accent:#8b85f5;--accent-h:#a29df8;--accent-bg:#2c2a55;--accent-text:#c9c6fb;--on-accent:#15142b;
  --danger:#f28b82;--danger-bg:#4a1f1d;--warn:#f2c46b;--warn-bg:#47360f;--ok:#9fd07a;--ok-bg:#24391a;--hl:#6b5a12;--hl-text:#fff7cf;--shadow:0 10px 40px rgba(0,0,0,.6);
  --c1-bg:#4a1f1f;--c1-fg:#ffd2d2;--c1-st:#7d2b2b;--c1:#f07a79;
  --c2-bg:#20381a;--c2-fg:#d7f2bd;--c2-st:#3c6a23;--c2:#8fca55;
  --c3-bg:#47261a;--c3-fg:#ffd9c9;--c3-st:#7c3b22;--c3:#ef8a5f;
  --c4-bg:#2b2756;--c4-fg:#dcd9ff;--c4-st:#4a439a;--c4:#a29df8;
  --c5-bg:#13314f;--c5-fg:#cfe5fb;--c5-st:#1f4f80;--c5:#6aaef0;
  --tk-kw:#d58bf0;--tk-str:#8fd18a;--tk-num:#f0b36b;--tk-com:#7d7c76;--tk-tag:#f39a6b;--tk-attr:#8ab4f8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius);padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover{background:var(--accent-h)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--hover)}
button.icon{padding:5px 7px}
button.danger{color:var(--danger)}
input[type=text],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 9px;outline:none}
input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input[type=checkbox]{accent-color:var(--accent);margin:0}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.ic-lg{width:20px;height:20px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--border);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:0 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent-text);cursor:pointer;white-space:nowrap}
.tag .x{cursor:pointer;opacity:.7}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}
mark,.hl{background:var(--hl);color:var(--hl-text);border-radius:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:2.5vh 2.5vw}
.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;width:100%;overflow:hidden;border:1px solid var(--border)}
.modal.big{width:95vw;height:95vh}
.modal.mid{max-width:640px}
.modal.small{max-width:440px}
.modal-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.modal-h .title{font-weight:600;font-size:15px}
.modal-b{padding:14px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}
.toast.err{background:var(--danger);color:#fff}
.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--border2);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.menu div:hover{background:var(--hover)}
.menu div.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.tk-kw{color:var(--tk-kw)}.tk-str{color:var(--tk-str)}.tk-num{color:var(--tk-num)}.tk-com{color:var(--tk-com);font-style:italic}.tk-tag{color:var(--tk-tag)}.tk-attr{color:var(--tk-attr)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* ---------- compare view ---------- */
.cmp{display:flex;flex-direction:column;height:100%;min-height:0}
.cmp-top{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.cmp-files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmp-file{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);font-size:13px;max-width:280px}
.cmp-file .sw{width:10px;height:10px;border-radius:3px;flex:none}
.cmp-file .base{font-size:11px;background:var(--accent-bg);color:var(--accent-text);padding:0 6px;border-radius:5px}
.cmp-opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px}
.cmp-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.cmp-grid{flex:1;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.65;min-height:0}
.cmp-head{position:sticky;top:0;z-index:2;display:grid;background:var(--panel);border-bottom:1px solid var(--border)}
.cmp-head>div{display:flex;align-items:center;gap:6px;padding:6px 8px;font-family:var(--sans);font-size:13px;border-left:1px solid var(--border);min-width:0}
.cmp-head>div:first-child{border-left:0}
.cmp-head select{padding:2px 6px;font-size:12px;max-width:100%}
.cmp-row{display:grid}
.cmp-cell{display:flex;min-width:0;border-left:1px solid var(--border)}
.cmp-cell:first-child{border-left:0}
.cmp-cell .ln{width:46px;flex:none;text-align:right;padding-right:8px;color:var(--faint);user-select:none}
.cmp-cell .tx{white-space:pre-wrap;word-break:break-all;flex:1;min-width:0;padding-right:8px}
.cmp-cell.empty{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--border) 5px 6px)}
.cmp-cell.k1{background:var(--c1-bg);color:var(--c1-fg)} .cmp-cell.k1 .ln{color:var(--c1-fg)} .k1 .d{background:var(--c1-st);border-radius:2px}
.cmp-cell.k2{background:var(--c2-bg);color:var(--c2-fg)} .cmp-cell.k2 .ln{color:var(--c2-fg)} .k2 .d{background:var(--c2-st);border-radius:2px}
.cmp-cell.k3{background:var(--c3-bg);color:var(--c3-fg)} .cmp-cell.k3 .ln{color:var(--c3-fg)} .k3 .d{background:var(--c3-st);border-radius:2px}
.cmp-cell.k4{background:var(--c4-bg);color:var(--c4-fg)} .cmp-cell.k4 .ln{color:var(--c4-fg)} .k4 .d{background:var(--c4-st);border-radius:2px}
.cmp-cell.k5{background:var(--c5-bg);color:var(--c5-fg)} .cmp-cell.k5 .ln{color:var(--c5-fg)} .k5 .d{background:var(--c5-st);border-radius:2px}
.cmp-row.cur{outline:2px solid var(--accent);outline-offset:-2px}
.cmp-row.sel .cmp-cell{box-shadow:inset 0 0 0 9999px rgba(79,70,229,.08)}
.cmp-fold{padding:3px 12px;color:var(--muted);font-family:var(--sans);font-size:12px;background:var(--panel2);cursor:pointer;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.cmp-fold:hover{color:var(--accent)}
.cmp-path{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--border);font-size:12px}
.cmp-path code{color:var(--accent-text);background:var(--accent-bg);padding:1px 7px;border-radius:5px;font-family:var(--mono)}
.cmp-err{margin:10px 14px;padding:8px 12px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:13px}
.cmp-empty{padding:40px;text-align:center;color:var(--muted)}
.dropzone{border:2px dashed var(--border2);border-radius:12px;padding:24px;text-align:center;color:var(--muted);cursor:pointer}
.dropzone.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}

#app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;min-width:0;max-width:260px;cursor:pointer}
.top .brand .ic{color:var(--accent)}
.sbox{flex:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.sinput{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:0 10px}
.sinput:focus-within{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-bg)}
.sinput input{border:0!important;background:transparent!important;box-shadow:none!important;flex:1;padding:7px 0;outline:none}
.sinput kbd{font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.sopts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;padding:2px 2px 0}
.sadv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;padding:8px 10px;background:var(--panel2);border-radius:8px;margin-top:2px}
.sadv select{padding:2px 6px;font-size:12px}
.theme-sw{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.theme-sw button{border-radius:0;border:0;padding:4px 7px}
.theme-sw button.on{background:var(--accent-bg);color:var(--accent-text)}
.body{flex:1;display:flex;min-height:0}
#side{width:250px;flex:none;border-right:1px solid var(--border);overflow:auto;padding:8px 6px;background:var(--panel)}
#side.hide{display:none}
#main{flex:1;overflow:auto;min-width:0}
.wrap{max-width:1100px;margin:0 auto;padding:18px 22px 60px}
.tree-row{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text);user-select:none}
.tree-row:hover{background:var(--hover)}
.tree-row.on{background:var(--accent-bg);color:var(--accent-text)}
.tree-row .tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
.tree-row .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
.tree-row.drop,.sub.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-bg)}
.side-sec{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);padding:10px 8px 4px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px}
.crumbs a{color:var(--accent-text);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.ptitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ptitle h1{font-size:22px;margin:0;font-weight:600;flex:1;min-width:0}
.sec{font-size:12px;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.list{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sub{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);cursor:pointer}
.sub:first-child{border-top:0}
.sub:hover{background:var(--hover)}
.sub .nm{font-weight:600;font-size:15px;color:var(--accent-text)}
.sub .ic{color:var(--accent)}
.fcard{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border);cursor:pointer}
.fcard:first-child{border-top:0}
.fcard:hover{background:var(--hover)}
.fcard .ficon{color:var(--muted)}
.fcard .ficon.note{color:var(--accent)} .fcard .ficon.log{color:var(--danger)}
.fcard .nm{font-weight:500}
.fcard .meta{font-size:12px;color:var(--faint);white-space:nowrap}
.fcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.fcard .acts{display:flex;gap:2px;opacity:.55}
.fcard:hover .acts{opacity:1}
.star.on{color:#d99a00}
.imgsec{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
.imgsec h3{margin:0;font-size:16px;font-weight:600;flex:1;min-width:0}
.imgsec .imgbox{margin-top:10px;border-radius:8px;overflow:hidden;background:var(--panel2);cursor:zoom-in;min-height:60px;display:flex;align-items:center;justify-content:center}
.imgsec .imgbox img{max-width:100%;display:block}
.imgsec .meta{font-size:12px;color:var(--faint);margin-top:6px;display:flex;gap:10px}
.drophint{border:1px dashed var(--border2);border-radius:10px;padding:10px;text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
.drophint.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:17px;margin:0 0 6px;font-weight:600}
/* home */
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.hgrid{grid-template-columns:minmax(0,1fr)}#side{display:none}}
.qc{padding:12px 14px;margin-bottom:16px;border-color:var(--accent)}
.qc input{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)} .stat .v{font-size:22px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .ic{color:var(--accent);width:22px;height:22px}
.tile b{display:block;margin-top:4px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.tagcloud{display:flex;gap:6px;flex-wrap:wrap}
/* search results */
.res{padding:10px 14px;border-top:1px solid var(--border);cursor:pointer}
.res:first-child{border-top:0}
.res:hover{background:var(--hover)}
.res .path{font-size:12px;color:var(--faint)}
.res .lines{font-family:var(--mono);font-size:12px;margin-top:6px;display:flex;flex-direction:column;gap:2px}
.res .lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);padding:1px 6px;border-radius:4px}
.res .lines div:hover{background:var(--accent-bg);color:var(--text)}
.res .lines .lno{color:var(--faint);display:inline-block;min-width:44px}
.notice{padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:10px}
/* viewer modal */
.vh .path{font-size:12px;color:var(--faint)}
.vtool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--border)}
.vtool .sinput{min-width:280px;flex:0 1 380px}
.vtool [data-mc]{white-space:nowrap}
.vtool .sinput input{padding:4px 0}
.lines-v{flex:1;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7;padding:6px 0;background:var(--panel2)}
.lines-v .l{display:flex;padding-right:12px}
.lines-v .l .n{width:64px;flex:none;text-align:right;padding-right:12px;color:var(--faint);user-select:none}
.lines-v .l .t{white-space:pre;flex:1}
.lines-v.wrap .l .t{white-space:pre-wrap;word-break:break-all}
.lines-v .l.e{background:var(--danger-bg);color:var(--danger)} .lines-v .l.e .n{color:var(--danger)}
.lines-v .l.w{background:var(--warn-bg);color:var(--warn)} .lines-v .l.w .n{color:var(--warn)}
.lines-v .l.sel{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-bg)}
.lines-v .l.cur mark{outline:2px solid var(--accent)}
.lines-v .more{padding:10px;text-align:center}
.vfoot{display:flex;align-items:center;gap:12px;padding:6px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.chip.e{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.chip.w{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.off{opacity:.45}
/* image viewer */
.iv{flex:1;overflow:hidden;background:var(--panel2);position:relative;cursor:grab}
.iv img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
/* editor */
.ed{display:flex;flex-direction:column;min-height:0;min-width:0;flex:1}
.ed-find{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel2);font-size:12.5px}
.ed-find input{padding:3px 8px;font-size:12.5px;width:200px}
.ed-wrap{flex:1;display:flex;min-height:0;position:relative;background:var(--panel)}
.ed-gutter{margin:0;padding:10px 10px 10px 0;width:56px;flex:none;text-align:right;color:var(--faint);font:12.5px/1.7 var(--mono);overflow:hidden;user-select:none;background:var(--panel2);border-right:1px solid var(--border)}
.ed-ta{flex:1;border:0!important;border-radius:0!important;box-shadow:none!important;resize:none;padding:10px 14px;font:12.5px/1.7 var(--mono);background:var(--panel)!important;tab-size:2;white-space:pre;overflow:auto}
.ed.wrapped .ed-ta{white-space:pre-wrap}
.ed.wrapped .ed-gutter{display:none}
.mdtool{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel2)}
.mdtool button{border:0;background:transparent;padding:4px 7px;border-radius:6px}
.mdtool button:hover{background:var(--hover)}
.mdtool .sep{width:1px;height:18px;background:var(--border2);margin:0 4px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 10px;font-size:12px;background:var(--panel)}
.seg button.on{background:var(--accent-bg);color:var(--accent-text)}
.mdpanes{flex:1;display:flex;min-height:0}
.mdpanes>.ed{border-right:1px solid var(--border)}
.mdpanes.v-source .mdprev{display:none}
.mdpanes.v-formatted>.ed{display:none}
.mdprev{flex:1;overflow:auto;padding:18px 26px;min-width:0}
.banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--warn-bg);color:var(--warn);font-size:13px}
/* rendered markdown */
.md{max-width:860px;line-height:1.65;font-size:14.5px}
.md h1{font-size:24px;margin:.2em 0 .6em;font-weight:650}
.md h2{font-size:19px;margin:1.3em 0 .5em;font-weight:650;padding-bottom:4px;border-bottom:1px solid var(--border)}
.md h3{font-size:16px;margin:1.2em 0 .4em;font-weight:650}
.md h4,.md h5,.md h6{font-size:14.5px;margin:1em 0 .3em}
.md p{margin:.5em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.md pre.md-code{position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto;font-size:12.5px;line-height:1.6}
.md pre.md-code code{background:none;border:0;padding:0;font-size:inherit}
.md .md-lang{position:absolute;top:4px;right:8px;font-size:11px;color:var(--faint);font-family:var(--sans)}
.md blockquote{margin:.6em 0;padding:4px 14px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0;color:var(--text)}
.md ul,.md ol{padding-left:24px;margin:.4em 0}
.md li.md-task{list-style:none;margin-left:-20px}
.md li.md-task input{margin-right:6px;vertical-align:-1px;cursor:pointer}
.md li.md-task .done{color:var(--muted);text-decoration:line-through}
.md .md-table-wrap{overflow:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:13.5px}
.md th,.md td{border:1px solid var(--border2);padding:5px 10px;text-align:left}
.md th{background:var(--panel2);font-weight:600}
.md hr{border:0;border-top:1px solid var(--border2);margin:1.2em 0}
.md a{color:var(--accent-text)}
.md img{max-width:100%;border-radius:6px;border:1px solid var(--border)}
.md .img-blocked{display:inline-block;font-size:12px;color:var(--muted);border:1px dashed var(--border2);padding:6px 10px;border-radius:6px}
.tpl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tpl div{border:1px solid var(--border);border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px}
.tpl div .ic{width:20px;height:20px;display:block;margin:0 auto 4px;color:var(--muted)}
.tpl div.on{border:2px solid var(--accent);padding:9px 5px;background:var(--accent-bg);color:var(--accent-text)}
.tpl div.on .ic{color:var(--accent)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border2);border-radius:8px;padding:5px 8px;background:var(--panel)}
.tagbox input{border:0!important;box-shadow:none!important;padding:2px!important;flex:1;min-width:120px;background:transparent!important}
.pick-list{max-height:52vh;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px}
.pick-list label{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--border);cursor:pointer;font-size:13px}
.pick-list label:first-child{border-top:0}
.pick-list label:hover{background:var(--hover)}
.hist div.h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--border)}
.hist div.h:first-child{border-top:0}
.welcome{max-width:560px;margin:12vh auto;text-align:center;padding:0 20px}
.welcome .logo{width:56px;height:56px;border-radius:14px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.welcome .logo .ic{width:30px;height:30px}
.welcome h1{font-size:26px;margin:0 0 8px}
.welcome .acts{display:flex;gap:10px;justify-content:center;margin:22px 0;flex-wrap:wrap}
.welcome .acts button{padding:9px 16px;font-size:14.5px}
.welcome .safe{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

.sfw{max-width:1180px}
.sfhint{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--accent-bg);color:var(--accent-text);font-size:13px;margin:0 0 12px}
.sfhint .ic{margin-top:2px}
.sftabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sftabs button{border:0;border-radius:0;background:transparent;padding:7px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.sftabs button.on{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:500}
.sftabs.small button{font-size:13px;padding:6px 10px}
.sfcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.sfcard.promo.open{border-color:var(--accent)}
.sfcardh{display:flex;align-items:center;gap:8px;margin:-2px 0 0}
.sfcard.open .sfcardh{margin-bottom:10px}
.sfcardh .idx{font-size:11px;background:var(--panel2);border-radius:5px;padding:0 6px;color:var(--muted)}
.sfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;margin-bottom:6px}
.sff{display:flex;flex-direction:column;gap:3px;min-width:0;margin-bottom:6px}
.sff>span{font-size:12px;color:var(--muted)}
.sff>em{font-style:normal;font-size:11.5px;color:var(--faint)}
.sff input[type=text],.sff select,.sff textarea,.sff input[type=datetime-local],.sff input[type=date]{width:100%;min-width:0}
.sff.wide{grid-column:1/-1}
.sff .row input{flex:1;min-width:0}
.sfsec{font-size:13px;font-weight:600;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sfsub{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.loc .lt-row{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:4px}
.loc .lt{border:0;background:transparent;font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:6px;color:var(--muted)}
.loc .lt.on{background:var(--accent-bg);color:var(--accent-text)}
.loc input,.loc textarea{width:100%}
.sftable{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-bottom:6px}
.sftable table{border-collapse:collapse;width:100%;font-size:13px}
.sftable th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);background:var(--panel2);padding:6px 8px;white-space:nowrap}
.sftable td{padding:4px 6px;border-top:1px solid var(--border);vertical-align:middle}
.sftable td input,.sftable td select{width:100%;padding:4px 7px;font-size:12.5px}
.sftable td input[type=text]{font-family:var(--mono)}
.sftable tr.del td{background:var(--danger-bg)}
.sftable td.acts{white-space:nowrap}
.sfcond{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.sfcond select{max-width:180px}
.sfcond .w120{width:140px}
.sfcond .grow{flex:1;min-width:180px;font-family:var(--mono);font-size:12.5px}
.sfrow3{display:grid;grid-template-columns:1fr 2fr 140px 32px;gap:6px;margin-bottom:6px}
.cin{display:inline-flex;align-items:center;gap:4px}
.cin input{width:90px}
.sffoot{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--border);margin-top:14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;z-index:3}
.issues{margin:0;padding-left:18px;font-size:12.5px;max-height:120px;overflow:auto}
.issues li.e{color:var(--danger)} .issues li.w{color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip .x{cursor:pointer;margin-left:2px}
.sfxml{height:60vh;display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.sfnote{margin-bottom:8px}
.side-tog{cursor:pointer;user-select:none}
.side-tog:hover{color:var(--accent)}

.metarow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 12px}
.metarow .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.xdoc{white-space:pre-wrap;font-size:13.5px;line-height:1.55;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:6px 0 10px;color:var(--text)}
.xtree{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px}
.xn{border-radius:6px}
.xn.hit>.xr{background:var(--warn-bg)}
.xn.dep>.xr .xname{text-decoration:line-through;text-decoration-color:var(--faint)}
.xr{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;min-width:0;font-size:13px}
.xr:hover{background:var(--hover)}
.xr.plain{cursor:default}
.xr .tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
.xo{flex:none;min-width:20px;height:18px;border-radius:9px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.xname{font-family:var(--mono);font-weight:600;color:var(--accent-text);white-space:nowrap}
.xr .chip{cursor:default;font-size:11px;padding:0 6px}
.xtt{white-space:nowrap;font-size:12.5px}
.xt{color:var(--accent-text);text-decoration:none;font-family:var(--mono);font-size:12px;cursor:pointer;border-bottom:1px dotted var(--accent)}
.xt:hover{border-bottom-style:solid}
.xv{color:var(--muted);font-size:12.5px}
.xd{flex:1;min-width:0;color:var(--faint);font-size:12.5px}
.xk{margin:2px 0 6px 22px;padding:4px 0 4px 12px;border-left:2px solid var(--border)}
.xsec{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin:10px 0 4px}
.xg{border:1px dashed var(--border2);border-radius:8px;padding:4px 6px;margin:4px 0}
.xg.choice{border-color:var(--accent);background:color-mix(in srgb,var(--accent-bg) 40%,transparent)}
.xgh{font-size:12px;color:var(--muted);padding:2px 4px 4px;display:flex;gap:6px;align-items:center}
.xgw{display:flex;gap:6px;align-items:flex-start;padding-left:22px}
.xgw>.xo{margin-top:8px}
.xgw>.xg{flex:1}
.xenum{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.xenum code,.xat code{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:0 5px}
table.xat{border-collapse:collapse;width:100%;font-size:13px}
table.xat td{border-top:1px solid var(--border);padding:6px 8px;vertical-align:top}
table.xat td:first-child{white-space:nowrap;font-weight:600;width:1%}
table.xat td:nth-child(2){width:1%;white-space:nowrap}
pre.xsrc{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto;font:12.5px/1.6 var(--mono);max-height:70vh;margin:0}
.tabbody{margin-top:10px}
.star.on{color:#d4a017}.star.on svg{fill:currentColor}
.notec{padding:12px 14px;margin-top:18px}
.notec .md{max-width:none;font-size:13.5px;margin-top:6px}
.warnc{padding:10px 14px;margin-bottom:12px;background:var(--warn-bg);color:var(--warn);border-color:transparent;font-size:13px}
.steps{margin:8px 0 12px;padding-left:20px;line-height:1.6;font-size:13.5px}
.lnk{border-top:1px solid var(--border);padding:6px 0}
.apiw{display:flex;gap:20px;align-items:flex-start}
.toc{position:sticky;top:0;width:210px;flex:none;max-height:80vh;overflow:auto;font-size:12.5px}
.toc .tl{padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--muted)}
.toc .tl:hover{background:var(--hover);color:var(--text)}
.toc .tl.l3{padding-left:16px}
.apibody{flex:1;min-width:0;max-width:none}
.apibody table{border-collapse:collapse;width:100%;margin:8px 0}
.apibody td,.apibody th{border:1px solid var(--border);padding:5px 8px;vertical-align:top;text-align:left}
.apibody pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;overflow:auto}
.apibody a{color:var(--accent-text);cursor:pointer;text-decoration:underline dotted}
.apibody .hit,.apibody h2.hit,.apibody h3.hit{background:var(--warn-bg)}
.guide table{border-collapse:collapse;margin:8px 0}
.guide td,.guide th{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}
.guide th{background:var(--panel2)}
mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:900px){.toc{display:none}}

/* ===== SFCC Docs look (dark first) ===== */
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel2:#f1f3f6;--hover:#eceff3;--text:#151a21;--muted:#5b6574;--faint:#8b95a3;
  --border:#e3e7ec;--border2:#cfd5dd;--accent:#2f6fed;--accent-h:#245bd0;--accent-bg:#e7efff;--accent-text:#1d4fbf;--on-accent:#fff;
  --sans:Inter,"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --radius:8px;--req:#1d4fbf;--req-bg:#e7efff;--rep:#8a5a00;--rep-bg:#fdf3dc;
}
[data-theme=dark]{
  --bg:#0d1117;--panel:#141a22;--panel2:#1a212b;--hover:#1f2733;--text:#e6eaf0;--muted:#9ba6b5;--faint:#6b7685;
  --border:#232b36;--border2:#313b49;--accent:#5b9cff;--accent-h:#7aaeff;--accent-bg:#16263f;--accent-text:#9cc3ff;--on-accent:#06101f;
  --warn:#f2c46b;--warn-bg:#3a2e12;--req:#9cc3ff;--req-bg:#16263f;--rep:#e8c27a;--rep-bg:#2d2615;
  --tk-kw:#d2a8ff;--tk-str:#a5d6a7;--tk-num:#f0b36b;--tk-com:#6b7685;--tk-tag:#7ee0c3;--tk-attr:#9cc3ff;
}
body{font-size:14px;letter-spacing:-.003em}
.top{height:54px;padding:0 16px;gap:10px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .brand{font-size:15px;gap:10px;max-width:220px}
.top .brand .badge{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),#7c5cff);color:#fff}
.top .brand .badge .ic{color:#fff;width:16px;height:16px}
.sinput{height:36px;border-radius:10px;background:var(--panel2);border-color:transparent}
.sinput input{font-size:13.5px}
.top>button{height:34px}
.theme-sw{height:34px;border-color:var(--border)}
#side{width:268px;padding:12px 10px;background:var(--panel);border-right:1px solid var(--border)}
.side-sec{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--faint);padding:16px 10px 6px}
.side-sec:first-child{padding-top:4px}
.tree-row.sd-row{position:relative;padding:6px 10px;gap:8px;border-radius:7px;font-size:13px;color:var(--muted);align-items:flex-start;line-height:1.35}
.tree-row.sd-row .tw{margin-top:1px}
.tree-row.sd-row .ellip{white-space:normal;overflow:visible}
.tree-row.sd-row:hover{color:var(--text)}
.tree-row.sd-row.on{background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.tree-row.sd-row.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.tree-row.sd-row .cnt{font-size:11px;background:var(--panel2);color:var(--faint);border-radius:10px;padding:0 7px;line-height:18px}
#main{background:var(--bg)}
.wrap{max-width:1180px;padding:26px 32px 80px}
.crumbs{font-size:12.5px;margin-bottom:10px}
.ptitle{gap:12px;margin-bottom:10px}
.ptitle h1{font-size:24px;font-weight:650;letter-spacing:-.015em}
.ptitle>.ic-lg{width:26px;height:26px;color:var(--accent)}
.metarow{margin:0 0 16px}
.metarow .chip{background:transparent;border-color:var(--border);font-size:11.5px;color:var(--muted)}
.stats{gap:12px;margin:6px 0 10px}
.stat{position:relative;padding:14px 16px;border-radius:12px;border-color:var(--border)}
.stat>.ic{position:absolute;right:14px;top:14px;color:var(--accent);opacity:.8}
.stat .l{font-size:12px}.stat .v{font-size:26px;font-weight:650;letter-spacing:-.02em}
.tiles{gap:12px}
.tile{padding:14px;border-radius:12px;transition:border-color .12s,transform .12s}
.tile:hover{transform:translateY(-1px)}
.tile>.ic{width:32px;height:32px;padding:7px;border-radius:9px;background:var(--accent-bg);color:var(--accent)}
.tile b{margin-top:10px;font-size:14px}
.list,.card{border-radius:12px;border-color:var(--border)}
.sub{padding:11px 16px}
.sub .nm{color:var(--text);font-weight:550}
.sub:hover .nm{color:var(--accent-text)}
.sftabs{gap:2px;border-bottom:1px solid var(--border);margin-bottom:6px}
.sftabs button{padding:9px 14px;font-size:13.5px}
.tbar{display:inline-flex;gap:2px}
button.sm{padding:4px 9px;font-size:12.5px;color:var(--muted)}
button.sm:hover{color:var(--text)}
/* schema tree */
.xtree{border-radius:12px;padding:8px 6px;border-color:var(--border)}
.xr{padding:5px 8px;gap:8px;font-size:13px;border-radius:7px}
.xname{color:var(--text);font-weight:600;font-size:13px}
.xn.open>.xr .xname{color:var(--accent-text)}
.xo{min-width:22px;height:20px;border-radius:6px;background:transparent;border-color:var(--border);color:var(--faint);font-family:var(--mono);font-size:11px}
.oc{font-size:11px;line-height:18px;padding:0 7px;border-radius:5px;white-space:nowrap}
.oc.req{background:var(--req-bg);color:var(--req);font-weight:600}
.oc.opt{color:var(--faint)}
.oc.rep{background:var(--rep-bg);color:var(--rep)}
.xr .chip.w{font-size:11px}
.xt{border-bottom:0;color:var(--accent-text);opacity:.9}
.xt:hover{text-decoration:underline;opacity:1}
.xd{color:var(--faint)}
.xk{margin:0 0 4px 19px;padding:2px 0 6px 14px;border-left:1px solid var(--border2)}
.xsec{font-size:10.5px;font-weight:600;letter-spacing:.08em;margin:12px 0 4px 8px}
.xval{padding:2px 8px 4px}
.xdoc{font-size:13px;background:transparent;border:0;border-left:2px solid var(--accent);border-radius:0;padding:2px 12px;margin:6px 0 8px 8px;color:var(--muted)}
.xg{border-radius:9px;border-color:var(--border2);margin:4px 0 4px 2px;padding:4px}
.xg.choice{background:color-mix(in srgb,var(--accent-bg) 45%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.xgh{font-size:11.5px;font-weight:600;color:var(--accent-text);padding:3px 8px 5px}
table.xat{margin:2px 0 4px}
table.xat td{border-top-color:var(--border);padding:7px 8px}
table.xat tr:first-child td{border-top:0}
.xenum code,.xat code,.md code{background:var(--panel2);border-color:var(--border)}
pre.xsrc{border-radius:12px;background:var(--panel)}
.notec{border-radius:12px}
.md{font-size:14.5px;line-height:1.7}
.md h2{font-size:18px;border-bottom:0;margin-top:1.6em}
.guide{max-width:820px}
.guide table{width:100%;font-size:13.5px;border-radius:10px;overflow:hidden}
.guide th{background:var(--panel2);font-weight:600}
.guide td,.guide th{border-color:var(--border)}
.welcome .logo{background:linear-gradient(135deg,var(--accent),#7c5cff);color:#fff;border-radius:16px}
.welcome .logo .ic{color:#fff}
.star.on{color:#f5b301}
/* source badges */
.vb{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:20px;padding:0 8px;border-radius:999px;white-space:nowrap;flex:none;border:1px solid transparent}
.vb .ic{width:12px;height:12px}
.vb.ok{background:#e3f6e8;color:#14692f;border-color:#b9e4c5}
.vb.ai{background:#fff2d9;color:#8a5200;border-color:#f3d79d}
.vb.gen{background:var(--accent-bg);color:var(--accent-text)}
.vb.own,.vb.zip{background:var(--panel2);color:var(--muted);border-color:var(--border)}
[data-theme=dark] .vb.ok{background:#0f2e1b;color:#7ee2a0;border-color:#1d5233}
[data-theme=dark] .vb.ai{background:#33260c;color:#f5c66a;border-color:#5c4416}
.vb.sm{padding:0 6px;font-size:11px}
.vb.dot{padding:0 5px;font-size:9.5px;line-height:15px;margin-left:auto;align-self:center}
.ptitle h1{flex:0 1 auto}
.ptitle .grow{flex:1}
.aibox{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;padding:10px 14px;border-radius:10px;margin:0 0 16px;background:#fff7e6;color:#6b4300;border:1px solid #f3d79d}
.aibox .ic{flex:none;margin-top:2px}
[data-theme=dark] .aibox{background:#241c0b;color:#f0d29a;border-color:#5c4416}
.legend{padding:6px 14px}
.legend .lg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border)}
.legend .lg:first-child{border-top:0}
.legend .vb{min-width:150px;justify-content:flex-start}
/* learn */
.learncard{padding:16px 18px;margin:6px 0 4px}
.learncard .lc-ic{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),#7c5cff);color:#fff;flex:none}
.learncard .lc-ic .ic{color:#fff}
.modesw,.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.modesw button,.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-size:13px;color:var(--muted)}
.modesw button.on,.seg button.on{background:var(--panel);color:var(--accent-text);box-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:600}
.pbar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-bottom:6px;border:1px solid var(--border)}
.pbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c5cff);border-radius:6px}
.modecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.modecard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;white-space:normal;padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--border)}
.modecard>.ic{color:var(--accent);width:26px;height:26px}
.modecard b{font-size:15px}
.modecard span{font-size:13px;color:var(--muted);line-height:1.45}
.modecard.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-bg)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ltile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .12s}
.ltile:hover{border-color:var(--accent)}
.ltile b{font-size:14px;line-height:1.35}
.ltile .small.muted{margin-top:6px;line-height:1.45}
.lnum{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-bg);color:var(--accent-text);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.lnum .ic{width:14px;height:14px}
.ltile.done{border-color:color-mix(in srgb,#2fbf71 45%,var(--border))}
.ltile.done .lnum{background:#e3f6e8;color:#14692f}
[data-theme=dark] .ltile.done .lnum{background:#0f2e1b;color:#7ee2a0}
.lessonbody{max-width:860px}
.crashbox{padding:14px 18px}
.crashbox .md{max-width:none}
.crashbox li{margin:4px 0}
.notesbox{display:flex;flex-direction:column;gap:8px}
.nb{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--text);font-size:13.5px;line-height:1.5;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.nb .ic{color:var(--warn);flex:none;margin-top:2px}
.qcard,.pcard,.entry{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.qcard.known{border-color:color-mix(in srgb,#2fbf71 45%,var(--border))}
.qn{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-text);background:var(--accent-bg);border-radius:6px;padding:1px 7px;margin-top:2px}
.qt{font-weight:600;font-size:14px;line-height:1.5}
.star-s{color:#d4a017}
.reveal{margin-top:8px}
.reveal .ans{margin-top:8px;padding:10px 14px;border-left:2px solid var(--accent);background:var(--panel2);border-radius:0 8px 8px 0;max-width:none;font-size:14px}
.pcard .md,.entry .md{max-width:none;font-size:14px}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}
.practice{padding:20px 22px;max-width:860px}
.practice .pq{font-size:16px;font-weight:600;margin:10px 0}
.etype{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--accent-text);background:var(--accent-bg);border-radius:6px;padding:1px 8px;flex:none}
.etype .ic{width:12px;height:12px}
.entry .codeview,.codecard .codeview{margin-top:8px;max-height:420px}
.sfform .sff{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px}
.sfform .sff>span:first-child{font-weight:600}
.sfform textarea,.sfform input[type=text],.sfform input[type=date],.sfform select{width:100%}
.sfform textarea.mono{font:12.5px/1.6 var(--mono)}
.sfform .seg{align-self:flex-start}
.topicpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;max-height:180px;overflow:auto;padding:8px;border:1px solid var(--border);border-radius:8px}
.codetabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:-1px}
.codetabs button{border-radius:8px 8px 0 0;border-bottom:0;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.codetabs button.on{background:var(--panel);color:var(--text);border-color:var(--border)}
.codecard{padding:10px 12px;border-top-left-radius:0}
.codebar{gap:6px;flex-wrap:wrap}
.finfo{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.finfo code{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.solpart{max-width:none}
.ced{display:flex;height:62vh;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.ced .cg{margin:0;padding:10px 8px;min-width:44px;text-align:right;color:var(--faint);background:var(--panel2);font:12.5px/1.6 var(--mono);overflow:hidden;user-select:none;border-right:1px solid var(--border)}
.ced textarea{flex:1;border:0!important;border-radius:0!important;box-shadow:none!important;resize:none;padding:10px 12px;font:12.5px/1.6 var(--mono);background:transparent!important;white-space:pre;tab-size:4;outline:none}
.cedw{display:flex;flex-direction:column;height:100%}
@media (max-width:900px){.modecards{grid-template-columns:1fr}}
.rtext{white-space:pre-wrap;font-size:14px;line-height:1.55;margin-top:8px}
.entry.rdone{opacity:.6}
.entry.rdone .rtext{text-decoration:line-through;text-decoration-color:var(--faint)}

</style>

        '- **FileNamePattern:** a regular expression. Empty means every file in the folder. Example: `^pricebook_.*\\.xml$`.',
        '- **NoFilesFoundHandling / ImportFailedHandling:** what to do when nothing is found or the import fails.',
        '- **ArchiveFolder:** where processed files go, relative to IMPEX. Default is `IMPEX/archive`.',
        '- **ImportMode:** see [[import-modes|Import modes]].',
        '',
        'Files reach `IMPEX/src` through WebDAV or SFTP. Coupon codes are the one export that comes out as CSV instead of XML.'
      ])
    },
    {
      id: 'catalogs', title: 'Catalogs: product vs storefront, and what makes a product show', area: 'catalog',
      sources: [['Trailhead: Explore B2C Commerce catalogs', TH + 'b2c-catalog-category-product/b2c-explore-catalogs'], ['Trailhead: Create categories', TH + 'b2c-catalog-category-product/b2c-create-categories'], ['Trailhead: Configure products', TH + 'b2c-catalog-category-product/b2c-configure-products']],
      body: md([
        '## Two kinds of catalog',
        '- **Product (master) catalog:** owns the products. Usually fed from a PIM. Not assigned to a site.',
        '- **Storefront (site) catalog:** only categories for navigation. Assigned to a site; **a site uses one storefront catalog**. Products from the master catalog are *assigned* to its categories.',
        '',
        'A product belongs to exactly one catalog. Editing it there changes it everywhere it is assigned.',
        '',
        '## A product shows on a site only when it is',
        '1. assigned to a category in that site\'s storefront catalog,',
        '2. online (and inside its online-from / online-to dates),',
        '3. searchable (for search and listing pages),',
        '4. priced in an active price book for the site, for quantity 1,',
        '5. available (inventory), depending on your storefront code,',
        '6. in the search index: run `SearchReindex` or wait for the incremental index after imports.',
        '',
        '## Category assignments in XML',
        '- `<category-assignment category-id="…" product-id="…"/>` lives in the catalog file of the catalog that owns the **category**, usually the storefront catalog.',
        '- `primary-flag` marks the primary category, used for breadcrumbs. Without one, the classification category is used.',
        '- `position` is not a number in the schema: it takes `top`, `bottom`, `auto` or `none`.',
        '- Remove an assignment with `mode="delete"` on that element.',
        '',
        '## Dynamic categorization',
        'Rule sets can assign products to categories automatically. They don\'t run by themselves after an import: run them again when new products arrive.',
        '',
        '## Order inside catalog.xml',
        'header → product-attribute-definitions → category → product → product-option → variation-attribute → category-assignment → recommendation. Open `catalog.xsd` in Schemas to see every field in order.'
      ])
    },
    {
      id: 'pricebooks', title: 'Price books: currencies, sale prices and site assignment', area: 'catalog',
      sources: [['Trailhead: Configure price books', TH + 'b2c-pricebooks-images-content/b2c-configure-price-books']],
      body: md([
        '## Basics',
        '- One price book = **one currency**. The currency can\'t be changed afterwards.',
        '- Price books are defined for the whole organization and become active on a site only when **assigned to that site**.',
        '- A site can use several price books, but only those in a currency enabled on the site count.',
        '- Every product sold needs a price for **quantity 1** in an active price book. Higher quantities in the same price table give tier prices.',
        '',
        '## List and sale prices',
        'The usual pattern per currency:',
        '- `brand-usd-list`: full prices for everything.',
        '- `brand-usd-sale`: only the products on sale, with the list book as its **parent** (shown as "based on" in Business Manager).',
        '',
        'The storefront then shows the sale price where there is one and the list price elsewhere. When several assigned books give a price for the same product, the system picks one by fixed rules; Salesforce material describes the lowest valid price winning, and dated price tables take priority over undated ones. Test a real product on a sandbox to confirm what your storefront shows.',
        '',
        '## Dates',
        'Price tables can have `online-from` / `online-to` for a sale period. Dates in the file are UTC. The SFCC builder in Folder Viewer converts from your time zone.',
        '',
        '## Removing prices',
        'A `price-table` element with `mode="delete"` removes that table. Deleting the whole price book removes all its prices: use with care.',
        '',
        '## Permissions',
        'Creating or changing price books needs *Manage_PriceBooks* (all) or *Manage_Site_PriceBooks* (site-specific).',
        '',
        '## Read-only price books',
        'An optional feature for very frequent price feeds from an ERP. Faster to import, but prices can\'t be edited in Business Manager.'
      ])
    },
    {
      id: 'promotions', title: 'Campaigns, promotions, coupons and qualifiers', area: 'marketing',
      sources: [['Trailhead: Explore campaigns and experience types', TH + 'b2c-campaigns-and-promotions/b2c-explore-campaigns-and-experience-types'], ['Trailhead: Campaigns and promotions (merchandising)', TH + 'cc-digital-merchandising/digital-campaigns-and-promotions'], ['Salesforce developers: Customize promotions', 'https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-promotions-for-developers.html']],
      body: md([
        '## How the pieces fit',
        '- A **campaign** has a schedule and qualifiers, and contains **experiences**: promotions, content slots, sorting rules and search sorting rules.',
        '- A **promotion** is the discount rule: what qualifies, what discount, how often.',
        '- **Qualifiers** decide who gets it: **coupons**, **customer groups** and **source codes**.',
        '- A promotion inside a disabled campaign is inactive, even if the promotion is enabled. A promotion\'s own schedule and qualifiers can only narrow the campaign\'s.',
        '',
        'Suggested order of work: create qualifiers first (coupons, groups), then promotions, then the campaign that ties them together.',
        '',
        '## Promotion classes and the order they apply',
        '1. **Product** promotions (on line items),',
        '2. **Order** promotions (on the total after product discounts),',
        '3. **Shipping** promotions.',
        '',
        'Within that, **exclusivity** (no exclusivity, exclusive within its class, or globally exclusive) and **rank** decide what can stack. Rank is a number: smaller wins.',
        '',
        '## Customer groups',
        'Built in: *Everyone*, *Registered* and *Unregistered*. Custom groups can be a static list of customers or dynamic rules (see `customergroup.xsd`).',
        '',
        '## Coupons',
        '- **Single code:** one shared code.',
        '- **List of codes:** up to 999 codes listed in the file.',
        '- **System codes:** the platform generates them (count, prefix, length 10–20).',
        '- Limits: per code, per customer, per time frame (days), and several codes per order. In the XML, `case-insensitive` comes before `redemption-limits`. Open `coupon.xsd` for the exact order.',
        '- Generated codes export as CSV.',
        '',
        '## Source codes',
        'A code on the URL (or typed in) that marks where the shopper came from, for example an affiliate. It can trigger promotions and price books and redirect to a landing page.',
        '',
        '## In the import file (promotion.xsd)',
        'Campaigns, promotions and promotion-campaign assignments live in one file. The assignment links each promotion to its campaign; without it the promotion never runs. Import coupons and customer groups **before** the promotions that use them.'
      ])
    },
    {
      id: 'replication', title: 'Replication: staging to production', area: 'ops',
      sources: [['Trailhead: Explore replication', TH + 'b2c-admin-replication/b2c-admin-explore-replication'], ['Trailhead: Configure data replication', TH + 'b2c-admin-replication/b2c-admin-configure-data-replication'], ['Commerce API: Replications (granular)', 'https://developer.salesforce.com/docs/commerce/commerce-api/references/replications']],
      body: md([
        '## The idea',
        'In the primary instance group, **staging** is where data is edited and imported. Replication copies it to **development** (to test) and then **production**. All replication processes are created and run from staging.',
        '',
        '- **Data replication:** global data (for example catalogs, price books, customer lists, preferences) and site data (for example campaigns, promotions, coupons, content, custom objects, search settings).',
        '- **Code replication:** moves a code version and activates it on the target.',
        '',
        'Only the data you select is replaced on the target; other data is left alone. Some data is never replicated and must be imported on the target directly, such as active data and import feeds.',
        '',
        '## Process types',
        '- **Transfer and publish:** copy and switch at once.',
        '- **Transfer**, then **publish** later. The publish must use exactly the tasks that were transferred.',
        '- **Undo:** roll back the last successful replication.',
        '- Any of these can run now, on a schedule, or as a job step.',
        '',
        '## Good habits',
        '- Replicate to development first, check logs, search and prices, then go to production.',
        '- Don\'t run jobs on the target, other replications, or Business Manager edits while a replication runs.',
        '- A failed recurring replication stops recurring. Check it.',
        '- Replicate dependent data together: campaigns need their coupons and source codes.',
        '',
        '## Page cache',
        'Replicating catalogs, sites or price books clears the storefront page cache automatically; promotions and static content don\'t. Skipping the cache clear can leave old prices on cached pages until the next clear. On production the refresh is spread over about 15 minutes.',
        '',
        '## Small urgent fixes',
        'Granular replication can push single products, price tables or content assets from staging to production without a full data replication.'
      ])
    },
    {
      id: 'checklist', title: 'Checklist before any XML import', area: 'import',
      sources: [['XML schemas', 'https://salesforcecommercecloud.github.io/b2c-dev-doc/docs/current/xsd/']],
      body: md([
        '- [ ] The root element has the right `xmlns` for that file type. Copy it from the schema page.',
        '- [ ] Elements are in **schema order**. Open the schema here and compare, or use **XML skeleton**.',
        '- [ ] IDs have no spaces at the start or end, and stay within the length limit (product IDs: 100 characters).',
        '- [ ] Dates and times are in **UTC** (`2026-11-20T18:30:00.000Z`).',
        '- [ ] Language attributes use a hyphen: `xml:lang="en-GB"`, not `en_GB`. Default values use `x-default`.',
        '- [ ] Booleans are `true` / `false`.',
        '- [ ] Currency codes are 3 capital letters and enabled on the site.',
        '- [ ] The **import mode** fits what you want ([[import-modes|Import modes]]).',
        '- [ ] New products have an online flag, or they arrive offline.',
        '- [ ] Things referred to already exist: categories for assignments, coupons and customer groups for promotions, parent price books.',
        '- [ ] Tried on a sandbox first. Keep the file, and an export from before the import, to compare.',
        '- [ ] After importing: search index, page cache, and replication to production if you work on staging.'
      ])
    }
  ];
})();

window.SFCC_LEARN = [{"sources": [["Trailhead: Architecture of B2C Commerce (configuration)", "https://trailhead.salesforce.com/content/learn/modules/architecture-of-commerce-cloud-digital/cc-digital-configuration"], ["Trailhead: Explore continuous integration", "https://trailhead.salesforce.com/content/learn/modules/b2c-build-processes-and-tests-for-technical-architects/b2c-explore-continuous-integration"]], "q": [{"id": "platform-q1", "lv": "basic", "top": true, "q": "What is a realm, and what are the PIG and SIG?", "a": "A realm is everything Salesforce provisions for one customer. The primary instance group (PIG) holds production, staging and development. The secondary instance group (SIG) holds the sandboxes used for development."}, {"id": "platform-q2", "lv": "basic", "top": true, "q": "Why is staging so important?", "a": "Merchandisers edit data on staging and release code is uploaded there. Replication always runs from staging to development or production, so staging is the controlled source of everything that goes live."}, {"id": "platform-q3", "lv": "basic", "top": false, "q": "What is Business Manager used for?", "a": "It's the web admin tool. Merchants manage catalogs, prices, promotions, content and orders under Merchant Tools; admins manage sites, jobs, replication, services, roles and quotas under Administration."}, {"id": "platform-q4", "lv": "mid", "top": true, "q": "Which data is organization-level and which is site-level? Give examples.", "a": "Organization: catalogs, price books, inventory lists, customer lists and global preferences. Site: campaigns and promotions, site preferences, content (unless a shared library), payment and shipping configuration. It affects which import screen, replication task and permission you use."}, {"id": "platform-q5", "lv": "mid", "top": false, "q": "What is a code version and why keep more than one?", "a": "A code version is a named set of cartridges uploaded to an instance. Only one is active. Keeping the previous version lets you roll back instantly by activating it again."}, {"id": "platform-q6", "lv": "mid", "top": false, "q": "How is an on-demand sandbox different from staging?", "a": "A sandbox is a personal, disposable development environment in the SIG with a small data set and most system jobs off. Staging is a permanent PIG instance holding real merchant data and acting as the replication source."}, {"id": "platform-q7", "lv": "adv", "top": false, "q": "Two brands in Europe and Asia want separate teams and data. One realm or two?", "a": "Usually one realm with several sites is enough: sites can share catalogs and settings. Choose separate realms when teams, data ownership, compliance or release cycles must be fully separate. Data can then only be shared by exporting and importing."}], "p": [{"lv": "easy", "t": "Where does the change go?", "q": "A merchandiser wants to change a product's price for the live shop. On which instance should they make the change, and how does it reach shoppers?", "a": "On **staging**, in the price book. Then a **data replication** (price books task) copies it to production. Large daily price feeds are often imported directly into production as well, to stay in sync."}, {"lv": "std", "t": "Plan the path of a hot fix", "q": "A bug in checkout code must go live today. Describe the steps from your laptop to production.", "a": "1. Fix and test on your **sandbox**.\n2. Merge, build, and upload the cartridges to **staging** as a new **code version** (client-certificate two-factor authentication is needed for staging).\n3. Run a **code replication** to **development**, test checkout there.\n4. Run a code replication to **production** and **activate** it.\n5. Keep the previous code version so you can switch back if something breaks."}], "notes": ["Staging is the only way to get code and merchant data into production in a controlled way. Don't edit live data directly on production unless it's a feed designed for that.", "\"Global\" vs \"site\" decides which import screen, which replication task and which permission you need.", "Never test with throwaway data on staging: replication can carry it to production."], "id": "platform", "title": "Platform and architecture", "icon": "world", "time": {"easy": 8, "crash": 5, "standard": 20}, "summary": "Realms, instances, sites, Business Manager and how code and data move.", "easy": "**SFCC (Salesforce B2C Commerce)** is a hosted platform for online shops. Salesforce runs the servers; you write the shop's code and manage its data.\n\nThink of it like a **shopping mall that Salesforce owns**:\n- The **realm** is your whole rented building.\n- Inside it are several **instances**, like separate floors: one where developers build (sandbox), one where the shop team prepares products and prices (staging), one for final testing (development), and the real shop customers visit (production).\n- Each instance can run several **sites** (shops), for example one per country or brand.\n- **Business Manager** is the back-office web screen where you manage products, prices, promotions and settings.\n\nCode goes from a developer's computer to a sandbox to try it, then to staging. From staging, both code and data are copied (\"replicated\") to production.\n\n**Key words**\n- **Realm:** everything one customer gets from Salesforce.\n- **Instance:** one environment (sandbox, staging, development, production).\n- **Site:** one storefront.\n- **Business Manager (BM):** the admin tool.\n- **Replication:** copying data or code from staging to development or production.", "crash": "- A **realm** = one customer's full setup. It has one **PIG** (primary instance group: staging, development, production) and one **SIG** (secondary group: sandboxes).\n- **Staging** = where merchants edit data and where code is uploaded for release. Replication runs **from staging** to development or production.\n- **Development** = test new code with real-like data before production.\n- **Production** = live shop, behind the CDN.\n- **Sandboxes** (on-demand sandboxes, ODS) = personal dev environments, created by API, most system jobs off.\n- **Organization** = all sites on an instance. Some data is **organization-wide** (catalogs, price books, customer lists); some is **site-specific** (campaigns, content, site preferences).\n- Sites in the same realm can share catalogs; different realms can't share data except by export/import.\n- Code is uploaded as **code versions**; one version is **active** per instance.\n- Uploading code to staging needs **two-factor authentication** with a client certificate.", "standard": "## Realm and instance groups\nA **realm** is the top-level unit Salesforce provisions for a merchant: servers, databases, file storage and tools. Every realm has:\n- a **primary instance group (PIG)** with **production**, **staging** and **development**, and\n- a **secondary instance group (SIG)** with **sandboxes**. Today these are usually **on-demand sandboxes**, created and deleted through an API and billed by credits.\n\nInside an instance, a request passes a load balancer, a **web server** (which also holds the page cache), then an **application server** (which runs your JavaScript). All app servers share a database schema and a file system holding cartridges, images and logs.\n\n## What each instance is for\n| Instance | Who uses it | What happens there |\n|---|---|---|\n| Sandbox | Developers | Write and test code with a small data set. Most system jobs are off. |\n| Staging | Merchandisers, release managers | Edit catalogs, prices, promotions, content. Upload release code. **Source of all replication.** |\n| Development | QA, developers | Test new code with the latest staging data. |\n| Production | Shoppers | Live sites behind the CDN. Feeds such as prices and stock are often imported here directly. |\n\n## Organization vs site\nAn instance hosts one **organization** with one or more **sites**. Data lives at one of two levels:\n- **Organization (global):** catalogs, price books, inventory lists, customer lists, system preferences.\n- **Site:** campaigns and promotions, content libraries (unless shared), site preferences, payment and shipping settings.\n\nThis matters for imports, permissions, and replication tasks.\n\n## Code versions\nCode is deployed as **cartridges** inside a **code version** (a folder on the instance). You can keep several versions and switch the **active** one, which gives an instant rollback. Activating a version also clears custom caches.\n\n## Business Manager\nThe admin UI. **Merchant Tools** holds per-site work (products, marketing, content, orders). **Administration** holds organization work (sites, jobs, replication, services, roles, quotas)."}, {"sources": [["Salesforce developers: SFRA modules (module.superModule)", "https://developer.salesforce.com/docs/commerce/commerce-api/guide/b2c-sfra-modules.html"], ["Salesforce developers: SFRA features and components", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-sfra-features-and-comps.html"]], "q": [{"id": "cartridges-q1", "lv": "basic", "top": true, "q": "What is the cartridge path and how is it resolved?", "a": "It's the ordered list of cartridges for a site. The platform searches it from left to right and uses the first cartridge that contains the requested file, which lets custom cartridges override base ones."}, {"id": "cartridges-q2", "lv": "basic", "top": true, "q": "Why shouldn't you change app_storefront_base directly?", "a": "Because upgrades of SFRA would overwrite or conflict with your changes. Override or extend files from your own cartridge placed to the left, so the base stays clean and upgradable."}, {"id": "cartridges-q3", "lv": "mid", "top": true, "q": "What does module.superModule do?", "a": "It returns the same module (same path and name) from the next cartridge to the right on the path, or null. You use it to extend a controller or model while still running the original logic."}, {"id": "cartridges-q4", "lv": "mid", "top": true, "q": "What's the difference between `*/cartridge/...` and `~/cartridge/...` in require?", "a": "`*` searches the entire cartridge path and takes the first match; `~` refers to the current cartridge only."}, {"id": "cartridges-q5", "lv": "mid", "top": false, "q": "Where are hooks.json and steptypes.json declared?", "a": "`hooks.json` (and `caches.json`) are referenced from the cartridge's `package.json`. `steptypes.json` must be in the cartridge's root folder."}, {"id": "cartridges-q6", "lv": "adv", "top": false, "q": "Your override of a base template stopped picking up a new SFRA feature after an upgrade. Why, and how do you avoid it?", "a": "A template in your cartridge fully replaces the base one, so new markup in the base never shows. Keep overrides minimal, prefer `isinclude`/decorators and model extensions, and diff your overrides against the new base on every upgrade."}], "p": [{"lv": "easy", "t": "Which file wins?", "q": "Path: `app_custom:int_pay:app_storefront_base`. `product/productDetails.isml` exists in `app_custom` and `app_storefront_base`. Which one renders?", "a": "The one in **app_custom**, because it's first (leftmost) on the path."}, {"lv": "std", "t": "Add a field to the product model without copying it", "q": "Show how to add `product.badge` from a custom attribute to SFRA's full product model.", "a": "Create `app_custom/cartridge/models/product/fullProduct.js`:\n```js\nvar base = module.superModule;\nmodule.exports = function (product, apiProduct, options) {\n    base.call(this, product, apiProduct, options);\n    product.badge = apiProduct.custom.badge || null;\n    return product;\n};\n```\nThe base model still runs; you only add your field. Templates can then read `product.badge`."}], "notes": ["Put your custom cartridge first, then plugins and integrations, then `app_storefront_base` last.", "A template that exists in your cartridge **replaces** the base one entirely. Keep overrides small and re-check them when you upgrade SFRA.", "Don't edit the `server` module. Write your own module if you need to extend it."], "id": "cartridges", "title": "Cartridges, cartridge path and SFRA", "icon": "packages", "time": {"easy": 8, "crash": 5, "standard": 20}, "summary": "How code is packaged, how the cartridge path decides which file wins, and how SFRA is organised.", "easy": "A **cartridge** is a folder of code: controllers, templates, scripts, styles and settings. A site uses a list of cartridges called the **cartridge path**.\n\nThink of the cartridge path as **a stack of transparent sheets**. When the site needs a file (say the product page template), it looks at the **first** sheet. If the file is there, it uses it. If not, it looks at the next sheet, and so on.\n\nSo you never edit Salesforce's base code. You put your own cartridge **in front of** it with just the files you want to change. That's called an **overlay**.\n\n**SFRA** (Storefront Reference Architecture) is Salesforce's ready-made shop. Its main cartridge is `app_storefront_base`. Your project adds cartridges like `app_custom_mybrand` in front of it, plus integration cartridges (payments, tax) usually called `int_…` or `plugin_…`.\n\n**Key words**\n- **Cartridge:** a code package.\n- **Cartridge path:** the ordered list, searched left to right.\n- **Overlay:** your cartridge overriding files from a later one.\n- **SFRA:** the reference storefront.", "crash": "- Cartridge path is searched **left to right**; the **first** match wins for templates, scripts, controllers and resources.\n- Never modify `app_storefront_base`. Overlay it with a custom cartridge on the left.\n- Typical path: `app_custom_brand:plugin_x:int_payment:app_storefront_base`.\n- `require('*/cartridge/scripts/x')` searches the whole path; `require('~/cartridge/…')` means the current cartridge.\n- `module.superModule` gives the **same file from the next cartridge to the right**: the basis for extending controllers and models.\n- The `modules` folder (with the `server` module) sits next to the cartridges; anything in it can be required by name, for example `require('server')`.\n- Business Manager has its own cartridge path, set on the Business Manager site.\n- `package.json` in a cartridge points to `hooks.json` and `caches.json`. `steptypes.json` sits in the cartridge root.", "standard": "## What's in a cartridge\n```\napp_custom_brand/\n  cartridge/\n    controllers/      Product.js, Cart.js …\n    models/           product/fullProduct.js …\n    scripts/          helpers, hooks, job steps\n    templates/default/  ISML templates\n    templates/resources/  *.properties (text per locale)\n    forms/default/    form definitions (XML)\n    static/default/   built CSS, JS, images\n    client/default/   source JS and SCSS (built with webpack)\n  package.json        → \"hooks\": \"./cartridge/scripts/hooks.json\", \"caches\": …\n```\n\n## How the path resolves\nThe site's cartridge path is set in **Administration › Sites › Manage Sites › (site) › Settings**. For any lookup (`res.render('product/productDetails')`, `require('*/cartridge/models/product')`, a resource key) the platform walks the path from left to right and takes the first cartridge that has the file.\n\n## Extending instead of copying\nCopying a whole base file into your cartridge works but freezes you on that version. Prefer extending:\n```js\n// app_custom_brand/cartridge/models/product/fullProduct.js\nvar base = module.superModule;   // the same file from the next cartridge on the right\nmodule.exports = function fullProduct(product, apiProduct, options) {\n    base.call(this, product, apiProduct, options);\n    product.badge = apiProduct.custom.badge || null;\n    return product;\n};\n```\n`module.superModule` returns the next matching module **to the right** of the current cartridge, or `null` if none. Chains of overlays can each call their super.\n\n## require styles\n| Style | Looks in |\n|---|---|\n| `require('*/cartridge/scripts/helpers/x')` | Whole cartridge path, first match |\n| `require('~/cartridge/scripts/x')` | Current cartridge only |\n| `require('app_storefront_base/cartridge/…')` | That named cartridge |\n| `require('dw/catalog/ProductMgr')` | Platform Script API |\n| `require('server')` | The `modules` folder |\n\n## SFRA layering\n- `app_storefront_base`: base storefront. Treat as read-only.\n- `plugin_*`: optional features (wishlists, gift registry…).\n- `int_*` / link cartridges: integrations from partners.\n- `app_custom_*`: your brand code, leftmost.\n- Client code is built with Node tooling (`sgmf-scripts`, webpack) into `static/`."}, {"sources": [["Salesforce developers: SFRA modules", "https://developer.salesforce.com/docs/commerce/commerce-api/guide/b2c-sfra-modules.html"], ["Salesforce developers: SFRA features and components", "https://developer.salesforce.com/docs/commerce/sfra/guide/b2c-sfra-features-and-comps.html"], ["Salesforce developers: Customize SFRA", "https://developer.salesforce.com/docs/commerce/b2c-commerce/guide/b2c-customizing-sfra.html"]], "q": [{"id": "controllers-q1", "lv": "basic", "top": true, "q": "What are req, res and next in an SFRA middleware?", "a": "`req` is the request (query string, form, customer, locale), `res` is the response object (render, json, redirect, view data), and `next` passes control to the next middleware in the route's chain."}, {"id": "controllers-q2", "lv": "basic", "top": true, "q": "What's the difference between server.append, server.prepend and server.replace?", "a": "Append adds middleware at the end of an existing route, prepend at the start, and replace discards the original chain and uses only the new middleware."}, {"id": "controllers-q3", "lv": "mid", "top": true, "q": "When would you choose replace over append?", "a": "When the base route performs work that must not run (or must not run twice): a payment or service call, a database transaction, an expensive lookup, or logic that's simply wrong for your business. Appending would run the base first."}, {"id": "controllers-q4", "lv": "mid", "top": true, "q": "How can appended middleware change the page if the base already called res.render?", "a": "`res.render` only stores the template name and data. Rendering happens after the whole chain finishes, so later middleware can still edit view data with `getViewData`/`setViewData`."}, {"id": "controllers-q5", "lv": "mid", "top": false, "q": "How do you extend a base controller?", "a": "`var page = module.superModule; server.extend(page);`, then `server.append/prepend/replace('RouteName', …)`, and finally `module.exports = server.exports();`."}, {"id": "controllers-q6", "lv": "mid", "top": false, "q": "How do you return JSON for an AJAX call?", "a": "Call `res.json(object)` in the route (and usually `next()`); SFRA serialises it with the right content type."}, {"id": "controllers-q7", "lv": "adv", "top": false, "q": "What is route:BeforeComplete used for?", "a": "It's an event fired after all middleware in a route ran. SFRA uses it to do work at the very end, such as saving form data in a transaction once the final view data is decided."}, {"id": "controllers-q8", "lv": "adv", "top": false, "q": "How would you add a login check to an existing route without changing it?", "a": "`server.prepend('Show', userLoggedIn.validateLoggedIn)` (or your own middleware) in an overlay controller that extends `module.superModule`."}], "p": [{"lv": "easy", "t": "Read the URL", "q": "What controller file and route handle `/Cart-AddProduct`?", "a": "File **Cart.js**, route **AddProduct** (registered with `server.post('AddProduct', …)`)."}, {"lv": "std", "t": "Add data to the product page", "q": "Add `isNewArrival` (true when the product's `creationDate` is under 30 days old) to the product page without copying Product.js.", "a": "```js\nvar server = require('server');\nserver.extend(module.superModule);\nserver.append('Show', function (req, res, next) {\n    var viewData = res.getViewData();\n    var ProductMgr = require('dw/catalog/ProductMgr');\n    var p = ProductMgr.getProduct(viewData.product.id);\n    var days = (Date.now() - p.creationDate.getTime()) / 86400000;\n    viewData.isNewArrival = days < 30;\n    res.setViewData(viewData);\n    next();\n});\nmodule.exports = server.exports();\n```\nIn the template: `<isif condition=\"${pdict.isNewArrival}\">New<\/isif>`."}, {"lv": "std", "t": "Avoid a double payment call", "q": "The base `CheckoutServices-PlaceOrder` calls the payment provider. You need different payment handling. Append or replace?", "a": "**Replace.** With append the base would still call the provider first, then yours: two authorisations. Use `server.replace('PlaceOrder', csrfProtection.validateAjaxRequest, function (req, res, next) { … })` and re-implement the flow, reusing base helpers where possible."}], "notes": ["Prefer `append`. It survives SFRA upgrades best.", "Use `replace` when the base would do expensive or one-time work you'd otherwise repeat.", "Put CSRF validation on every state-changing POST route.", "Keep controllers thin: put logic in helpers and models so it can be unit tested."], "id": "controllers", "title": "SFRA controllers and middleware", "icon": "code", "time": {"easy": 10, "crash": 5, "standard": 25}, "summary": "Routes, the req/res/next chain, and extending with append, prepend and replace.", "easy": "A **controller** is the code that answers a URL. In SFRA the URL `/Product-Show?pid=123` means: controller file **Product.js**, route **Show**.\n\nA route is a **line of small steps** (functions). Each step gets:\n- `req`: what the shopper sent,\n- `res`: what you'll send back,\n- `next`: \"I'm done, go to the next step\".\n\nThe last step usually calls `res.render('some/template', data)` to show a page, or `res.json(data)` for AJAX.\n\nTo change a base route without copying it you can:\n- **append**: add a step at the **end** (most common, for adding data),\n- **prepend**: add a step at the **start** (checks before the base runs),\n- **re
